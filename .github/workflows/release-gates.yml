name: release gates

# Release-only, paid evidence on one immutable dev commit. Keeping this as a workflow makes the
# credential boundary reproducible: no model token is copied to a developer machine, and every
# public artifact is generated by the exact tree it names. The preflight runs before any job can
# enter the protected environment or spend a token.
on:
  workflow_dispatch:
    inputs:
      expected_reviewer_sha:
        description: "Exact current dev commit to measure"
        required: true
        type: string
      version:
        description: "Release candidate version (X.Y.Z)"
        required: true
        type: string
      channel:
        description: "standard keeps every quality-promotion floor; recovery requires an explicit withheld reason"
        required: true
        default: standard
        type: choice
        options:
          - standard
          - recovery
      recovery_reason:
        description: "Required only for recovery: historical_holdout_fixed_retention_low"
        required: false
        type: string
      confirm:
        description: "Type RUN_RELEASE_GATES to authorize all four paid gates"
        required: true
        type: string

run-name: Release gates v${{ inputs.version }} on ${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: release-gates-${{ inputs.expected_reviewer_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: immutable candidate preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable dev request
        env:
          EXPECTED_REVIEWER_SHA: ${{ inputs.expected_reviewer_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
          CONFIRM: ${{ inputs.confirm }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${DISPATCH_REF}" == "refs/heads/dev" ]]
          [[ "${EXPECTED_REVIEWER_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_REVIEWER_SHA}" == "${DISPATCH_SHA}" ]]
          [[ "${EXPECTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${CONFIRM}" == "RUN_RELEASE_GATES" ]]
          if [[ "${RELEASE_CHANNEL}" == "standard" ]]; then
            [[ -z "${RECOVERY_REASON}" ]]
          elif [[ "${RELEASE_CHANNEL}" == "recovery" ]]; then
            [[ "${RECOVERY_REASON}" == "historical_holdout_fixed_retention_low" ]]
          else
            exit 1
          fi

      - name: Check out the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_reviewer_sha }}
          persist-credentials: false

      - name: Bind the requested version to the candidate
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          actual=$(node -p 'require("./package.json").version')
          [[ "${actual}" == "${EXPECTED_VERSION}" ]]
          test -z "$(git status --porcelain)"

  qualification:
    name: qualification corpus
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: self-review
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_reviewer_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Fetch the digest-pinned engine
        run: node scripts/fetch-engine.mjs "${RUNNER_TEMP}/ocr"

      - name: Run and score the full qualification corpus
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          OCR_BINARY: ${{ runner.temp }}/ocr
          OCR_REPORT: ${{ runner.temp }}/qualification-raw.json
          OCR_LLM_URL: ${{ secrets.KFQ_MODEL_ENDPOINT }}
          OCR_LLM_TOKEN: ${{ secrets.KFQ_MODEL_TOKEN }}
          OCR_LLM_MODEL: gpt-oss-120b
          OCR_USE_ANTHROPIC: "false"
          KFQ_SINGLE_SHOT: "1"
        shell: bash
        run: |
          set -euo pipefail
          npm run corpus && status=0 || status=$?
          if (( status > 1 )); then
            exit "${status}"
          fi
          test -s "${OCR_REPORT}"
          npm run check:qualification -- "${OCR_REPORT}"
          out="${GITHUB_WORKSPACE}/corpus/evidence/qualification-$(date -u +%F)-v${EXPECTED_VERSION}.json"
          npm run qualification:evidence -- --raw "${OCR_REPORT}" --out "${out}"

      - name: Upload redacted qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-v${{ inputs.version }}
          path: corpus/evidence/qualification-*-v${{ inputs.version }}.json
          if-no-files-found: error
          retention-days: 90

  historical:
    name: calibrated historical replay
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: self-review
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_reviewer_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prepare immutable Keiko history
        shell: bash
        run: |
          set -euo pipefail
          repo="${RUNNER_TEMP}/keiko.git"
          git init --quiet "${repo}"
          git -C "${repo}" remote add origin https://github.com/oscharko-dev/Keiko.git
          git -C "${repo}" fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/pull/3003/head:refs/remotes/origin/replay-pr-3003 \
            +refs/pull/3005/head:refs/remotes/origin/replay-pr-3005 \
            +refs/pull/3006/head:refs/remotes/origin/replay-pr-3006 \
            +refs/pull/3028/head:refs/remotes/origin/replay-pr-3028 \
            +refs/pull/3031/head:refs/remotes/origin/replay-pr-3031 \
            +refs/pull/3032/head:refs/remotes/origin/replay-pr-3032 \
            +refs/pull/3037/head:refs/remotes/origin/replay-pr-3037 \
            +refs/pull/3040/head:refs/remotes/origin/replay-pr-3040 \
            +refs/pull/3041/head:refs/remotes/origin/replay-pr-3041
          echo "CONSUMER_REPO=${repo}" >> "${GITHUB_ENV}"

      - name: Mint a read-only Keiko token
        id: keiko-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KFQ_REVIEW_APP_ID }}
          private-key: ${{ secrets.KFQ_REVIEW_APP_PRIVATE_KEY }}
          owner: oscharko-dev
          repositories: Keiko
          permission-pull-requests: read

      - name: Harvest the calibrated historical population
        env:
          GH_TOKEN: ${{ steps.keiko-token.outputs.token }}
        run: >-
          npm run corpus:harvest --
          --repo oscharko-dev/Keiko
          --prs 3003,3005,3006,3028,3031,3032,3037,3040,3041
          --out "${RUNNER_TEMP}/historical-harvest.json"

      - name: Prove the zero-token full-population plan
        env:
          OCR_LLM_MODEL: gpt-oss-120b
        run: >-
          node corpus/historical-replay.mjs
          --dry-run
          --harvest "${RUNNER_TEMP}/historical-harvest.json"
          --repo "${CONSUMER_REPO}"
          --holdout-from-pr 3037
          --max-tokens 61000000

      - name: Execute the calibrated historical replay
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          OCR_LLM_MODEL: gpt-oss-120b
          OCR_LLM_URL: ${{ secrets.KFQ_MODEL_ENDPOINT }}
          OCR_LLM_TOKEN: ${{ secrets.KFQ_MODEL_TOKEN }}
          OCR_USE_ANTHROPIC: "false"
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/corpus/evidence/historical-replay-$(date -u +%F)-v${EXPECTED_VERSION}.json"
          node corpus/historical-replay.mjs \
            --execute \
            --harvest "${RUNNER_TEMP}/historical-harvest.json" \
            --repo "${CONSUMER_REPO}" \
            --holdout-from-pr 3037 \
            --max-tokens 61000000 \
            --out "${out}"

      - name: Upload redacted historical evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: historical-v${{ inputs.version }}
          path: corpus/evidence/historical-replay-*-v${{ inputs.version }}.json
          if-no-files-found: error
          retention-days: 90

  seed:
    name: consumer seed gate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: self-review
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_reviewer_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prepare the Keiko consumer repository
        shell: bash
        run: |
          set -euo pipefail
          repo="${RUNNER_TEMP}/keiko.git"
          git init --quiet "${repo}"
          git -C "${repo}" remote add origin https://github.com/oscharko-dev/Keiko.git
          git -C "${repo}" fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          echo "CONSUMER_REPO=${repo}" >> "${GITHUB_ENV}"

      - name: Run every consumer seed case
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          KFQ_MODEL_ENDPOINT: ${{ secrets.KFQ_MODEL_ENDPOINT }}
          KFQ_MODEL_ID: gpt-oss-120b
          KFQ_MODEL_PROTOCOL: openai
          KFQ_MODEL_TOKEN_ENV: KFQ_RELEASE_MODEL_TOKEN
          KFQ_RELEASE_MODEL_TOKEN: ${{ secrets.KFQ_MODEL_TOKEN }}
          KFQ_SINGLE_SHOT: "1"
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/corpus/evidence/seed-gate-$(date -u +%F)-v${EXPECTED_VERSION}.md"
          npm run corpus:seed -- \
            --repo "${CONSUMER_REPO}" \
            --attempts 2 \
            --evidence "${out}"

      - name: Upload seed evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seed-v${{ inputs.version }}
          path: corpus/evidence/seed-gate-*-v${{ inputs.version }}.md
          if-no-files-found: error
          retention-days: 90

  completion:
    name: stratified completion gate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: self-review
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_reviewer_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prepare three immutable Keiko pull requests
        shell: bash
        run: |
          set -euo pipefail
          repo="${RUNNER_TEMP}/keiko.git"
          git init --quiet "${repo}"
          git -C "${repo}" remote add origin https://github.com/oscharko-dev/Keiko.git
          git -C "${repo}" fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/pull/2970/head:refs/remotes/origin/replay-pr-2970 \
            +refs/pull/3011/head:refs/remotes/origin/replay-pr-3011 \
            +refs/pull/3089/head:refs/remotes/origin/replay-pr-3089
          echo "CONSUMER_REPO=${repo}" >> "${GITHUB_ENV}"

      - name: Prove the zero-token stratified plan
        run: >-
          npm run corpus:completion --
          --repo "${CONSUMER_REPO}"
          --pr 2970
          --pr 3011
          --pr 3089
          --runs 1
          --dry-run

      - name: Run 41-file, 19-file, and 79-file completion attempts
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          KFQ_MODEL_ENDPOINT: ${{ secrets.KFQ_MODEL_ENDPOINT }}
          KFQ_MODEL_ID: gpt-oss-120b
          KFQ_MODEL_PROTOCOL: openai
          KFQ_MODEL_TOKEN_ENV: KFQ_RELEASE_MODEL_TOKEN
          KFQ_RELEASE_MODEL_TOKEN: ${{ secrets.KFQ_MODEL_TOKEN }}
          KFQ_SINGLE_SHOT: "1"
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/corpus/evidence/completion-$(date -u +%F)-v${EXPECTED_VERSION}.md"
          npm run corpus:completion -- \
            --repo "${CONSUMER_REPO}" \
            --pr 2970 \
            --pr 3011 \
            --pr 3089 \
            --runs 1 \
            --evidence "${out}"

      - name: Upload completion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: completion-v${{ inputs.version }}
          path: corpus/evidence/completion-*-v${{ inputs.version }}.md
          if-no-files-found: error
          retention-days: 90

  promotion:
    name: release evidence gate
    needs:
      - preflight
      - qualification
      - historical
      - seed
      - completion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_reviewer_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualification-v${{ inputs.version }}
          path: ${{ runner.temp }}/release-evidence/qualification

      - name: Download historical evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: historical-v${{ inputs.version }}
          path: ${{ runner.temp }}/release-evidence/historical

      - name: Download seed evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: seed-v${{ inputs.version }}
          path: ${{ runner.temp }}/release-evidence/seed

      - name: Download completion evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: completion-v${{ inputs.version }}
          path: ${{ runner.temp }}/release-evidence/completion

      - name: Validate the complete release-evidence set
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/release-evidence
          EXPECTED_HEAD: ${{ inputs.expected_reviewer_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          qualification=("${EVIDENCE_ROOT}/qualification"/qualification-*-v"${EXPECTED_VERSION}".json)
          historical=("${EVIDENCE_ROOT}/historical"/historical-replay-*-v"${EXPECTED_VERSION}".json)
          seed=("${EVIDENCE_ROOT}/seed"/seed-gate-*-v"${EXPECTED_VERSION}".md)
          completion=("${EVIDENCE_ROOT}/completion"/completion-*-v"${EXPECTED_VERSION}".md)

          require_single_evidence() {
            local label="$1"
            shift
            if (( $# != 1 )); then
              echo "::error::Expected exactly one ${label} evidence file; found $#."
              exit 1
            fi
            if [[ ! -f "$1" ]]; then
              echo "::error::The selected ${label} evidence path is not a file."
              exit 1
            fi
          }

          require_single_evidence qualification "${qualification[@]}"
          require_single_evidence historical "${historical[@]}"
          require_single_evidence seed "${seed[@]}"
          require_single_evidence completion "${completion[@]}"
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_HEAD}" ]]
          candidate_tree=$(git rev-parse HEAD^{tree})
          channel_args=(--channel "${RELEASE_CHANNEL}")
          if [[ "${RELEASE_CHANNEL}" == "recovery" ]]; then
            channel_args+=(--recovery-reason "${RECOVERY_REASON}")
          fi

          node scripts/check-release-evidence.mjs \
            --version "${EXPECTED_VERSION}" \
            --head "${EXPECTED_HEAD}" \
            --tree "${candidate_tree}" \
            --qualification "${qualification[0]}" \
            --historical "${historical[0]}" \
            --seed "${seed[0]}" \
            --completion "${completion[0]}" \
            "${channel_args[@]}"
