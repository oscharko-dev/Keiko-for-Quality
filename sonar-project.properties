# SonarCloud CI-based analysis, mirroring the Keiko consumer's Free-plan model: the scanner runs
# in CI against the exact checkout, Automatic Analysis is disabled, and the active Sonar way gate
# is waited on. The plan cannot associate the public Keiko Banking Grade gate (ID 156389), so the
# required `verify` aggregate checks that definition for drift and enforces its stricter evidence
# after the scan. KfQ additionally requires zero unresolved issues across all of dev and loads the
# three new-code ratings directly instead of trusting the public gate definition by name alone.
#
# sonar.projectVersion is intentionally NOT set here — the CI step passes it from package.json,
# so the New Code Definition (previous_version) has a real value on every analysis.
sonar.projectKey=oscharko-dev_Keiko-for-Quality
sonar.organization=oscharko-dev
sonar.projectName=Keiko for Quality
sonar.sourceEncoding=UTF-8

sonar.typescript.tsconfigPaths=tsconfig.json

# Sources and tests are explicit and disjoint: test.inclusions removes the matching paths from
# main-code scope, and the exclusions pin that split across scanner upgrades. corpus/ and scripts/
# are product code here — plain Node ESM outside the TypeScript program, but reviewable source.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs
# design-system/ and .github/assets/kq/ are design ARTIFACTS, excluded for the same reason as
# dist/: analysing them demands changes that break the artifact's purpose. index.html is a
# design-tool bundle export (its JS is generated); the email templates deliberately use the
# deprecated-attribute, layout-table HTML that Outlook's renderer requires (the .prettierignore
# entry records the same decision for formatting); the glyph SVGs are generated art. None of it
# executes in the product — the reviewer's published comments carry only sanitized text and
# pinned image URLs.
sonar.exclusions=**/dist/**,**/build/**,**/coverage/**,**/node_modules/**,**/*.test.ts,**/*.test.mjs,design-system/**,.github/assets/**

# Copy-paste detection is switched off for the seeded-defect corpus, and only for it.
#
# `corpus/cases.mjs` is a TABLE: thirty-two cases, each a small two-commit history with the same
# four fields. CPD reports that repeated shape as ~75% duplication, which measures the table's
# regularity rather than any defect — and the one change it would motivate is the wrong one. The
# file's own contract is that a case stays small and explicit, "so a case that fails points at one
# behaviour, not at a haystack"; factoring the cases through a builder to satisfy a duplication
# ratio would hide exactly what each case tests. The file is still analysed for everything else.
sonar.cpd.exclusions=corpus/cases.mjs

# dist/index.js is a committed build artifact (consumers execute it; check:bundle proves it matches
# the source byte-for-byte), so analyzing it would double every finding in bundled form.
# It is caught by the dist/** exclusion above; this comment records that the exclusion is a
# deliberate decision about a tracked file, not housekeeping.

# S8689 ("confidential data in logs") is suppressed for the two measurement scripts, and only for
# them. Both exist to PRINT model-spend accounting — token COUNTS, noise counts, tokens-per-finding
# ratios — read from a qualification report file. The rule's taint heuristic sees file input flowing
# into console output next to the identifier "tokens" and reports a credential leak; these values
# are integers counting spend, the report file is this repository's own redacted artifact (counts,
# digests, and ids by construction — its writer is corpus/run.mjs, whose output shape is pinned by
# tests), and printing them is the scripts' entire purpose. Everything else in both files stays
# fully analysed.
# S8707 ("canonicalized path must be validated") is suppressed for the five operator scripts that
# take a filesystem path on argv, and only for them. Every one of those paths IS validated before
# any filesystem call, and by the same helper: scripts/cli-args.mjs's cliPathArgument (non-empty
# string, no NUL byte, the expected extension where one is required, normalized via resolve). What
# the helper deliberately does not do is confine the result to a base directory — and base-directory
# containment is the only shape the rule's taint pattern recognizes as validation. Containment is
# exactly what these tools must not enforce: the calling workflow legitimately hands fetch-engine a
# runner temp path outside the repository, and release-assets an out-dir staged beside it. The
# helper's own doc comment records that decision; this block records why the rule cannot see it.
# The files are enumerated one by one rather than as scripts/**, so a future argv path in scripts/
# that does NOT go through cliPathArgument is still reported.
#
# S4036 ("make sure PATH contains only fixed, unwriteable directories") is suppressed for the five
# corpus files that spawn git, and only for them. This repository already answered the rule, in
# code, before the rule reported it: corpus/fixed-path.mjs exists for exactly this reason, cites
# S4036 in its own header comment, and pins PATH to two root-owned directories that both carry git —
# so every flagged call site is a use of the mitigation, not an absence of one. The rule fires on
# the presence of a PATH assignment and cannot tell the two apart. Pinning an absolute /usr/bin/git
# instead would trade a reviewed constant for a host assumption that breaks wherever git lives
# elsewhere, and corpus/real-diffs.test.mjs already pins the FIXED_PATH posture as the intended one.
#
# S8786 ("simplify this regular expression, super-linear due to backtracking") is suppressed for
# src/publish/sanitize.ts, and only for it. Fourteen of that file's patterns were rewritten to be
# linear; three cannot be, and the reason is uniform: LINK, LINK_NEUTRALIZE and GENERIC_HEAD are
# quadratic in scan RESTARTS, not in backtracking within an attempt, and every reformulation that
# removes the restart also changes which strings match. For patterns that decide what this reviewer
# publishes, a narrower language is the worse trade, and each constant's doc comment records the
# specific reformulation examined and the input it would stop matching. What makes the residual
# safe is a bound rather than an argument: all three now run only on input already capped at
# MAX_BODY_CHARS, and sanitize.test.ts pins that with adversarial bodies under an explicit ceiling —
# an executable guard where this suppression is only a note. Suppressing the rule file-wide is the
# cost: a NEW super-linear pattern added to this file would not be reported, and those tests, not
# the analyser, are what would have to catch it.
sonar.issue.ignore.multicriteria=spendlog1,spendlog2,clipath1,clipath2,clipath3,clipath4,clipath5,fixedpath1,fixedpath2,fixedpath3,fixedpath4,fixedpath5,sanitizere1
sonar.issue.ignore.multicriteria.spendlog1.ruleKey=jssecurity:S8689
sonar.issue.ignore.multicriteria.spendlog1.resourceKey=scripts/check-qualification.mjs
sonar.issue.ignore.multicriteria.spendlog2.ruleKey=jssecurity:S8689
sonar.issue.ignore.multicriteria.spendlog2.resourceKey=corpus/run.mjs
sonar.issue.ignore.multicriteria.clipath1.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.clipath1.resourceKey=scripts/release-assets.mjs
sonar.issue.ignore.multicriteria.clipath2.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.clipath2.resourceKey=scripts/fetch-engine.mjs
sonar.issue.ignore.multicriteria.clipath3.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.clipath3.resourceKey=scripts/check-qualification.mjs
sonar.issue.ignore.multicriteria.clipath4.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.clipath4.resourceKey=scripts/assert-diagnostic-vocabulary.mjs
sonar.issue.ignore.multicriteria.clipath5.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.clipath5.resourceKey=scripts/filter-lcov.mjs
sonar.issue.ignore.multicriteria.fixedpath1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.fixedpath1.resourceKey=corpus/run.mjs
sonar.issue.ignore.multicriteria.fixedpath2.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.fixedpath2.resourceKey=corpus/binding.mjs
sonar.issue.ignore.multicriteria.fixedpath3.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.fixedpath3.resourceKey=corpus/real-diffs.mjs
sonar.issue.ignore.multicriteria.fixedpath4.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.fixedpath4.resourceKey=corpus/seed-gate.mjs
sonar.issue.ignore.multicriteria.fixedpath5.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.fixedpath5.resourceKey=corpus/completion-gate.mjs
sonar.issue.ignore.multicriteria.sanitizere1.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.sanitizere1.resourceKey=src/publish/sanitize.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions are narrower than the analysis scope on purpose: everything below stays
# fully analyzed (issues, hotspots, duplication) but is exempt from the new-code coverage ratio.
# Only the named script and corpus DRIVERS are exempt: their top-level flows are subprocess,
# bootstrap, or artifact orchestration that in-process coverage cannot observe meaningfully. Script
# libraries and import-safe commands remain in the 85% new-code scope, including all three Sonar
# evidence modules; changing them without executable coverage must fail the gate. The excluded
# drivers' end-to-end behaviour is pinned by their startup, release, and corpus-harness tests. The
# corpus LIBRARIES that carry real logic — arena-lib.mjs, arena-fetch.mjs, rule-source.mjs, and
# seed-gate-lib.mjs — likewise keep their in-process coverage duty. seed-gate-cases.mjs is a table
# exactly like cases.mjs.
sonar.coverage.exclusions=scripts/assert-diagnostic-vocabulary.mjs,scripts/build.mjs,scripts/check-ast-grep-pin.mjs,scripts/check-bundle.mjs,scripts/check-engine-pin.mjs,scripts/fetch-engine.mjs,scripts/filter-lcov.mjs,scripts/qualification-evidence.mjs,scripts/register-ts-hooks.mjs,scripts/release.mjs,corpus/run.mjs,corpus/real-diffs.mjs,corpus/binding.mjs,corpus/cases.mjs,corpus/fixed-path.mjs,corpus/fixtures/**,corpus/arena.mjs,corpus/seed-gate.mjs,corpus/seed-gate-cases.mjs,corpus/completion-gate.mjs,corpus/operating-point-sweep.mjs

# No PL/SQL sources exist here. Clearing the suffixes stops the bundled PLSQL analyzer from
# emitting its rules-disabled warning on every run — same reasoning as the Keiko consumer.
sonar.plsql.file.suffixes=-
