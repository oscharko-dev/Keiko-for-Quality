name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The reviewer runs inside other people's CI with a model credential and comment-write access, so
# its own pipeline holds no more authority than reading its source.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # Consumers execute dist/index.js, not src/. This proves the committed artifact is the one
      # this source produces, so a pinned action SHA actually pins reviewed code.
      - name: Verify committed bundle is reproducible
        run: npm run check:bundle

  engine-pin:
    name: engine pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # Downloads the pinned engine and verifies its digest. This is the supply-chain claim the
      # product makes to every consumer, so it is proved on every change rather than assumed.
      - name: Verify pinned engine digest
        run: npm run check:engine-pin

  action-smoke:
    name: action smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # A synthetic fork-originated event. It exercises the whole entrypoint — bundle load, event
      # parsing, eligibility, output writing — and settles before any credential or model call is
      # needed, so the smoke test needs no secrets.
      - name: Write synthetic event
        run: |
          cat > "${RUNNER_TEMP}/event.json" <<'JSON'
          {
            "action": "synchronize",
            "pull_request": {
              "number": 1,
              "draft": false,
              "head": {
                "sha": "1111111111111111111111111111111111111111",
                "repo": { "full_name": "attacker/Keiko-for-Quality" }
              },
              "base": {
                "sha": "2222222222222222222222222222222222222222",
                "ref": "dev",
                "repo": { "full_name": "oscharko-dev/Keiko-for-Quality" }
              }
            }
          }
          JSON

      # Proves the committed bundle actually executes under the node24 action runtime on a real
      # runner. Everything else in this workflow runs the source through Vitest, which would not
      # notice a bundle that fails to load.
      - name: Run the action against the synthetic event
        id: smoke
        uses: ./
        env:
          GITHUB_EVENT_PATH: ${{ runner.temp }}/event.json
        with:
          profile: examples/review-profile.json
          model_endpoint: https://example.invalid/v1
          model_id: unused-in-this-path
          model_protocol: anthropic
          model_token_env: SMOKE_UNUSED_TOKEN
          target_branches: dev

      - name: Assert the fork head was skipped, with a reason
        env:
          OUTCOME: ${{ steps.smoke.outputs.outcome }}
          REASON: ${{ steps.smoke.outputs.reason }}
        run: |
          echo "outcome=${OUTCOME} reason=${REASON}"
          test "${OUTCOME}" = "skipped"
          test "${REASON}" = "eligibility.skipped.fork"
