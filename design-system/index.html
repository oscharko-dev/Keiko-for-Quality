  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // The embedded README-widget panel predates the monitored card contract in widget/. Keep it
    // explicitly labelled as a historical layout specimen so illustrative numbers and the former
    // settlement labels can never be mistaken for live monitoring data. The executable renderer,
    // metric definitions and current visual contract live in widget/ and its tests.
    template = template.replace(
      'Widget service — live numbers',
      'Widget contract — live values are rendered by widget/'
    );
    // "Acted on" was an inference the product cannot prove. Historical email and widget examples
    // use the observable review-thread state instead.
    template = template.replaceAll('>acted on<', '>resolved<');
    const widgetSpecimenStart = template.indexOf('>README widgets<');
    const widgetSpecimenEnd = template.indexOf('</section>', widgetSpecimenStart);
    if (widgetSpecimenStart >= 0 && widgetSpecimenEnd > widgetSpecimenStart) {
      const widgetSpecimen = template
        .slice(widgetSpecimenStart, widgetSpecimenEnd)
        .replace('>README widgets<', '>README widget — historical layout specimen<')
        .replace('>S · M · CARD · BANNER<', '>NOT LIVE · SEE WIDGET/<')
        .replace(
          "One markdown line in a README is the brand's most-seen surface. The orca and its green carry every variant; the numbers are the repository's own, rendered live.",
          'Illustrative layout only: these values are not monitoring data. The exact live metrics, labels and card layout are defined and tested in widget/.'
        )
        .replaceAll('>COMPLETE<', '>RUN OK<');
      template =
        template.slice(0, widgetSpecimenStart) +
        widgetSpecimen +
        template.slice(widgetSpecimenEnd);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

4 0.005 160);\n  --focus-w: 2px;\n\n  --fg: oklch(0.97 0.003 160);\n  --fg-muted: oklch(0.74 0.004 160);\n  --fg-dim: oklch(0.66 0.004 160);\n  --fg-faint: oklch(0.64 0.004 160);\n\n  --accent: oklch(0.72 0.124 160); /* brand \"orca green\" — was #4eba87, now oklch so the whole token system is single-space */\n  --accent-bright: oklch(0.78 0.13 160);\n  --accent-dim: color-mix(in oklch, #4eba87 18%, transparent);\n  --accent-line: color-mix(in oklch, #4eba87 40%, transparent);\n  --accent-glow: color-mix(in oklch, #4eba87 26%, transparent);\n  /* text-tone alias — equals --accent in dark; darkened to ≥4.5:1 on white in light */\n  --accent-text: var(--accent);\n  /* accessibility-tuned accent roles (measured live on a11y-audit.html) */\n  --accent-solid: var(--accent);          /* accent FILL with no text (checkbox/slider/step dot) — ≥3:1 vs surface */\n  --accent-solid-ink: var(--ink-inverse); /* the mark/glyph sitting on --accent-solid */\n  --accent-on-tint: var(--accent-text);   /* accent TEXT on an accent tint (chips, citations) — ≥4.5:1 */\n  --ink-inverse: oklch(0.18 0.005 160);\n\n  --warn: oklch(0.78 0.13 75);\n  --danger: oklch(0.68 0.16 25);\n  --ok: oklch(0.74 0.13 146);      /* success — its own status green (hue 146), separable from the interactive accent (160) */\n  --info: oklch(0.74 0.1 240);\n\n  --radius: 14px;\n  --radius-sm: 9px;\n  --radius-lg: 18px;\n\n  --font-ui: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* elevation — defined for the DARK base too. */\n  --shadow-card: 0 1px 0 0 oklch(1 0 0 / 0.03) inset, 0 8px 24px -12px rgba(0, 0, 0, 0.6);\n  --shadow-pop: 0 18px 50px -18px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--line);\n}\n\n/* ===== LIGHT THEME — warm-neutral, same orca-green accent ===== */\n[data-theme=\"light\"] {\n  color-scheme: light;\n  --bg: oklch(0.955 0.004 160);\n  --surface: oklch(0.978 0.003 160);\n  --card: oklch(1 0 0);\n  --card-2: oklch(0.96 0.004 160);\n  --inset: oklch(0.945 0.005 160);\n  --line: oklch(0.88 0.006 160);\n  --line-soft: oklch(0.915 0.005 160);\n  --line-strong: oklch(0.8 0.008 160);\n  --grid-dot: oklch(0.78 0.012 160);\n  --fg: oklch(0.26 0.012 160);\n  --fg-muted: oklch(0.42 0.011 160);\n  --fg-dim: oklch(0.48 0.01 160);\n  --fg-faint: oklch(0.52 0.01 160);\n  --accent-text: oklch(0.48 0.13 160);\n  --accent-solid: oklch(0.52 0.15 160);  /* darker green: 4.96:1 vs white, room for a white mark */\n  --accent-solid-ink: oklch(1 0 0);\n  --accent-on-tint: oklch(0.43 0.13 160); /* 6.3:1 on the pale accent tint */\n  --ink-inverse: oklch(0.18 0.005 160);\n  --accent-bright: oklch(0.52 0.13 160);\n  --danger: oklch(0.5 0.18 25);\n  --warn: oklch(0.43 0.14 75);\n  --info: oklch(0.45 0.15 240);\n  --ok: oklch(0.5 0.13 146);\n  --shadow-card: 0 1px 0 0 oklch(1 0 0 / 0.7) inset, 0 6px 18px -12px rgba(20, 30, 25, 0.22);\n  --shadow-pop: 0 18px 50px -18px rgba(20, 30, 25, 0.26), 0 0 0 1px var(--line);\n}\n\n/* ===== a11y base ===== */\n:focus-visible {\n  outline: var(--focus-w, 2px) solid transparent; /* surfaces the ring in forced-colors / Windows High Contrast */\n  outline-offset: 2px;\n  border-radius: 3px;\n  /* two-tone ring: a neutral separator hugging the control + the accent ring outside it. */\n  box-shadow: 0 0 0 2px var(--bg), 0 0 0 calc(var(--focus-w, 2px) + 2px) var(--accent-text);\n}\n.skip-link {\n  position: fixed; top: 10px; left: 10px; z-index: 200;\n  padding: 10px 15px; background: var(--card); color: var(--fg);\n  border: 1px solid var(--accent-line); border-radius: var(--radius-sm);\n  font-family: var(--font-ui); font-size: 13px; text-decoration: none;\n  transform: translateY(-180%); transition: transform 0.15s;\n}\n.skip-link:focus { transform: none; }\n\n/* ============================================================\n   HIGH CONTRAST — a first-class, selectable third mode.\n   Single-source HC palettes — the raw values live here exactly once.\n   ============================================================ */\n:root {\n  /* HC · DARK palette */\n  --hc-d-bg: oklch(0.11 0.004 160);\n  --hc-d-surface: oklch(0.145 0.004 160);\n  --hc-d-card: oklch(0.185 0.004 160);\n  --hc-d-card-2: oklch(0.225 0.004 160);\n  --hc-d-inset: oklch(0.09 0.004 160);\n  --hc-d-line: oklch(0.62 0.006 160);\n  --hc-d-line-soft: oklch(0.5 0.005 160);\n  --hc-d-line-strong: oklch(0.74 0.006 160);\n  --hc-d-grid-dot: oklch(0.52 0.006 160);\n  --hc-d-fg: oklch(1 0 0);\n  --hc-d-fg-muted: oklch(0.88 0.004 160);\n  --hc-d-fg-dim: oklch(0.84 0.004 160);\n  --hc-d-fg-faint: oklch(0.82 0.004 160);\n  --hc-d-accent-bright: oklch(0.88 0.15 160);\n  --hc-d-accent-text: oklch(0.86 0.16 160);\n  --hc-d-accent-dim: color-mix(in oklch, var(--accent) 28%, transparent);\n  --hc-d-accent-line: color-mix(in oklch, var(--accent) 72%, transparent);\n  --hc-d-accent-glow: color-mix(in oklch, var(--accent) 42%, transparent);\n  --hc-d-warn: oklch(0.88 0.14 80);\n  --hc-d-danger: oklch(0.78 0.17 25);\n  --hc-d-ok: oklch(0.82 0.15 146);\n  --hc-d-info: oklch(0.84 0.12 240);\n  --hc-d-shadow-card: 0 0 0 1px var(--hc-d-line), 0 8px 24px -12px rgba(0, 0, 0, 0.7);\n  --hc-d-shadow-pop: 0 0 0 1px var(--hc-d-line-strong), 0 18px 50px -18px rgba(0, 0, 0, 0.85);\n\n  /* HC · LIGHT palette */\n  --hc-l-bg: oklch(1 0 0);\n  --hc-l-surface: oklch(0.99 0.002 160);\n  --hc-l-card: oklch(1 0 0);\n  --hc-l-card-2: oklch(0.965 0.004 160);\n  --hc-l-inset: oklch(0.95 0.004 160);\n  --hc-l-line: oklch(0.45 0.008 160);\n  --hc-l-line-soft: oklch(0.6 0.006 160);\n  --hc-l-line-strong: oklch(0.35 0.01 160);\n  --hc-l-grid-dot: oklch(0.6 0.01 160);\n  --hc-l-fg: oklch(0.13 0.01 160);\n  --hc-l-fg-muted: oklch(0.3 0.012 160);\n  --hc-l-fg-dim: oklch(0.34 0.012 160);\n  --hc-l-fg-faint: oklch(0.36 0.012 160);\n  --hc-l-accent-text: oklch(0.42 0.14 160);\n  --hc-l-accent-bright: oklch(0.42 0.14 160);\n  --hc-l-accent-dim: color-mix(in oklch, var(--accent) 22%, transparent);\n  --hc-l-accent-line: color-mix(in oklch, var(--hc-l-accent-text) 78%, transparent);\n  --hc-l-accent-glow: color-mix(in oklch, var(--hc-l-accent-text) 32%, transparent);\n  --hc-l-danger: oklch(0.42 0.19 25);\n  --hc-l-warn: oklch(0.38 0.14 75);\n  --hc-l-info: oklch(0.4 0.16 240);\n  --hc-l-ok: oklch(0.4 0.14 146);\n  --hc-l-shadow-card: 0 0 0 1px var(--hc-l-line-strong);\n  --hc-l-shadow-pop: 0 18px 50px -18px rgba(20, 30, 25, 0.32), 0 0 0 1px var(--hc-l-line-strong);\n}\n\n@media (prefers-contrast: more) {\n  :root {\n    color-scheme: dark;\n    --bg: var(--hc-d-bg); --surface: var(--hc-d-surface); --card: var(--hc-d-card); --card-2: var(--hc-d-card-2); --inset: var(--hc-d-inset);\n    --line: var(--hc-d-line); --line-soft: var(--hc-d-line-soft); --line-strong: var(--hc-d-line-strong); --grid-dot: var(--hc-d-grid-dot);\n    --focus-w: 3px;\n    --fg: var(--hc-d-fg); --fg-muted: var(--hc-d-fg-muted); --fg-dim: var(--hc-d-fg-dim); --fg-faint: var(--hc-d-fg-faint);\n    --accent-bright: var(--hc-d-accent-bright); --accent-text: var(--hc-d-accent-text);\n    --accent-dim: var(--hc-d-accent-dim); --accent-line: var(--hc-d-accent-line); --accent-glow: var(--hc-d-accent-glow);\n    --warn: var(--hc-d-warn); --danger: var(--hc-d-danger); --ok: var(--hc-d-ok); --info: var(--hc-d-info);\n    --shadow-card: var(--hc-d-shadow-card); --shadow-pop: var(--hc-d-shadow-pop);\n  }\n  [data-theme=\"light\"] {\n    color-scheme: light;\n    --bg: var(--hc-l-bg); --surface: var(--hc-l-surface); --card: var(--hc-l-card); --card-2: var(--hc-l-card-2); --inset: var(--hc-l-inset);\n    --line: var(--hc-l-line); --line-soft: var(--hc-l-line-soft); --line-strong: var(--hc-l-line-strong); --grid-dot: var(--hc-l-grid-dot);\n    --focus-w: 3px;\n    --fg: var(--hc-l-fg); --fg-muted: var(--hc-l-fg-muted); --fg-dim: var(--hc-l-fg-dim); --fg-faint: var(--hc-l-fg-faint);\n    --accent-text: var(--hc-l-accent-text); --accent-bright: var(--hc-l-accent-bright);\n    --accent-dim: var(--hc-l-accent-dim); --accent-line: var(--hc-l-accent-line); --accent-glow: var(--hc-l-accent-glow);\n    --danger: var(--hc-l-danger); --warn: var(--hc-l-warn); --info: var(--hc-l-info); --ok: var(--hc-l-ok);\n    --shadow-card: var(--hc-l-shadow-card); --shadow-pop: var(--hc-l-shadow-pop);\n  }\n}\n\n/* explicit in-app override — identical palettes, higher specificity. */\n[data-hc=\"more\"] {\n  color-scheme: dark;\n  --bg: var(--hc-d-bg); --surface: var(--hc-d-surface); --card: var(--hc-d-card); --card-2: var(--hc-d-card-2); --inset: var(--hc-d-inset);\n  --line: var(--hc-d-line); --line-soft: var(--hc-d-line-soft); --line-strong: var(--hc-d-line-strong); --grid-dot: var(--hc-d-grid-dot);\n  --focus-w: 3px;\n  --fg: var(--hc-d-fg); --fg-muted: var(--hc-d-fg-muted); --fg-dim: var(--hc-d-fg-dim); --fg-faint: var(--hc-d-fg-faint);\n  --accent-bright: var(--hc-d-accent-bright); --accent-text: var(--hc-d-accent-text);\n  --accent-dim: var(--hc-d-accent-dim); --accent-line: var(--hc-d-accent-line); --accent-glow: var(--hc-d-accent-glow);\n  --warn: var(--hc-d-warn); --danger: var(--hc-d-danger); --ok: var(--hc-d-ok); --info: var(--hc-d-info);\n  --shadow-card: var(--hc-d-shadow-card); --shadow-pop: var(--hc-d-shadow-pop);\n}\n[data-hc=\"more\"][data-theme=\"light\"] {\n  color-scheme: light;\n  --bg: var(--hc-l-bg); --surface: var(--hc-l-surface); --card: var(--hc-l-card); --card-2: var(--hc-l-card-2); --inset: var(--hc-l-inset);\n  --line: var(--hc-l-line); --line-soft: var(--hc-l-line-soft); --line-strong: var(--hc-l-line-strong); --grid-dot: var(--hc-l-grid-dot);\n  --focus-w: 3px;\n  --fg: var(--hc-l-fg); --fg-muted: var(--hc-l-fg-muted); --fg-dim: var(--hc-l-fg-dim); --fg-faint: var(--hc-l-fg-faint);\n  --accent-text: var(--hc-l-accent-text); --accent-bright: var(--hc-l-accent-bright);\n  --accent-dim: var(--hc-l-accent-dim); --accent-line: var(--hc-l-accent-line); --accent-glow: var(--hc-l-accent-glow);\n  --danger: var(--hc-l-danger); --warn: var(--hc-l-warn); --info: var(--hc-l-info); --ok: var(--hc-l-ok);\n  --shadow-card: var(--hc-l-shadow-card); --shadow-pop: var(--hc-l-shadow-pop);\n}\n\n/* Windows / forced-colors High Contrast */\n@media (forced-colors: active) {\n  :focus-visible { outline: 3px solid Highlight; outline-offset: 2px; box-shadow: none; }\n  .kx-win, .card { border: 1px solid CanvasText; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.001ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   semantic.css — the middle + top of Keiko's three-tier token\n   architecture.\n     1. PRIMITIVES   primitives.css   (raw oklch, shadows, radius)\n     2. SCALES       this file        (space · motion · z · opacity · blur · weight · leading)\n     3. SEMANTIC     this file        (background.* · text.* · action.* · feedback.* · focus …)\n     4. COMPONENT    this file        (button.* · input.* · card.* · ai.* · table.* · nav.*)\n   Every semantic + component token RESOLVES to a primitive. Because the\n   primitives already redefine themselves for light / HC / forced-colors,\n   these aliases inherit all modes automatically.\n   Load AFTER primitives.css, BEFORE the component class files.\n   ============================================================ */\n\n:root {\n  /* ───────────── SCALE · SPACING — 2-based rhythm ───────────── */\n  --space-0: 0;\n  --space-1: 2px;   /* hairline insets */\n  --space-2: 4px;   /* icon-to-icon in a cluster */\n  --space-3: 6px;   /* chip / small-button padding */\n  --space-4: 8px;   /* default gap between related elements */\n  --space-5: 12px;  /* list-row padding, menu items */\n  --space-6: 14px;  /* card inner padding, composer */\n  --space-7: 18px;  /* gap between cards */\n  --space-8: 24px;  /* dot-grid pitch · block spacing */\n  --space-9: 32px;  /* sub-section separation */\n  --space-10: 48px; /* section separation */\n  --space-12: 64px;\n  --space-16: 96px;\n\n  /* ───────────── SCALE · RADIUS (alias) ───────────── */\n  --radius-pill: 999px;\n  --radius-control: var(--radius-sm);  /* chips, inputs, buttons, menu items */\n  --radius-surface: var(--radius);     /* cards, windows, panels, popovers */\n  --radius-floating: var(--radius-lg); /* composer, sheets */\n\n  /* ───────────── SCALE · TYPE WEIGHT ───────────── */\n  --weight-regular: 400; /* @kind font */\n  --weight-medium: 500; /* @kind font */\n  --weight-semibold: 600; /* @kind font */\n  --weight-strong: 650; /* @kind font */ /* the brand/title weight used in chrome */\n\n  /* ───────────── SCALE · LINE-HEIGHT ───────────── */\n  --leading-tight: 1.1; /* @kind font */\n  --leading-snug: 1.3; /* @kind font */\n  --leading-normal: 1.5; /* @kind font */\n  --leading-relaxed: 1.65; /* @kind font */\n\n  /* ───────────── SCALE · TYPE SIZE — 11px floor ───────────── */\n  --text-caption: 11px;\n  --text-label: 12px;\n  --text-body-sm: 13px;\n  --text-body: 14px;\n  --text-body-lg: 15px;\n  --text-heading: 17px;\n  --text-title: 22px;\n  --text-title-lg: 28px;\n  --text-display-sm: 36px;\n  --text-display: 50px;\n\n  /* ───────────── SCALE · OPACITY ───────────── */\n  --opacity-disabled: 0.42; /* @kind other */\n  --opacity-muted: 0.64; /* @kind other */\n  --opacity-hover-veil: 0.06; /* @kind other */\n  --opacity-scrim: 0.55; /* @kind other */\n  --opacity-scrim-strong: 0.72; /* @kind other */\n\n  /* ───────────── SCALE · BLUR ───────────── */\n  --blur-sm: 4px;\n  --blur-md: 12px;\n  --blur-lg: 28px;\n\n  /* ───────────── SCALE · MOTION ───────────── */\n  --dur-instant: 80ms; /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 180ms; /* @kind other */\n  --dur-slow: 260ms; /* @kind other */\n  --dur-flow: 1100ms; /* @kind other */\n\n  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-in: cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n\n  /* ───────────── SCALE · Z-INDEX — named layers ───────────── */\n  --z-base: 0; /* @kind other */\n  --z-canvas-window: 10; /* @kind other */\n  --z-canvas-window-active: 20; /* @kind other */\n  --z-rail: 40; /* @kind other */\n  --z-nav: 50; /* @kind other */\n  --z-sticky: 80; /* @kind other */\n  --z-dropdown: 100; /* @kind other */\n  --z-overlay: 200; /* @kind other */\n  --z-modal: 300; /* @kind other */\n  --z-popover: 400; /* @kind other */\n  --z-toast: 500; /* @kind other */\n  --z-tooltip: 600; /* @kind other */\n\n  /* ───────────── SCALE · BREAKPOINTS ───────────── */\n  --bp-xs: 480px;\n  --bp-sm: 640px;\n  --bp-md: 768px;\n  --bp-lg: 900px;\n  --bp-xl: 1200px;\n  --bp-2xl: 1536px;\n\n  /* ───────────── SCALE · DENSITY ───────────── */\n  --control-height: 34px;\n  --control-height-sm: 28px;\n  --control-height-lg: 40px;\n  --control-pad-x: 14px;\n  --row-pad-y: 9px;\n  --row-pad-x: 12px;\n\n  /* ════════════ SEMANTIC TOKENS ════════════ */\n\n  /* background — the room the app sits in */\n  --background-primary: var(--bg);\n  --background-secondary: var(--surface);\n\n  /* surface — raised material */\n  --surface-primary: var(--card);\n  --surface-secondary: var(--card-2);\n  --surface-elevated: var(--card-2);\n  --surface-inset: var(--inset);\n  --surface-overlay: var(--surface);\n  --surface-accent-subtle: var(--accent-dim);\n  --surface-accent-glow: var(--accent-glow);\n\n  /* text */\n  --text-primary: var(--fg);\n  --text-secondary: var(--fg-muted);\n  --text-tertiary: var(--fg-dim);\n  --text-faint: var(--fg-faint);\n  --text-disabled: var(--fg-faint);\n  --text-inverse: var(--ink-inverse);\n  --text-accent: var(--accent-text);\n  --text-on-accent: var(--ink-inverse);\n\n  /* border */\n  --border-subtle: var(--line-soft);\n  --border-default: var(--line);\n  --border-strong: var(--line-strong);\n  --border-accent: var(--accent-line);\n\n  /* action — interactive intent */\n  --action-primary: var(--accent);\n  --action-primary-text: var(--accent-text);\n  --action-secondary-surface: var(--card);\n  --action-secondary-border: var(--line);\n  --action-tertiary-text: var(--fg-muted);\n\n  /* feedback — status, always paired with icon + word */\n  --feedback-success: var(--ok);\n  --feedback-warning: var(--warn);\n  --feedback-danger: var(--danger);\n  --feedback-info: var(--info);\n  --feedback-success-surface: color-mix(in oklch, var(--ok) 12%, transparent);\n  --feedback-warning-surface: color-mix(in oklch, var(--warn) 12%, transparent);\n  --feedback-danger-surface: color-mix(in oklch, var(--danger) 12%, transparent);\n  --feedback-info-surface: color-mix(in oklch, var(--info) 12%, transparent);\n\n  /* focus / selection */\n  --focus-ring: var(--accent-text);\n  --focus-width: var(--focus-w);\n  --selection-surface: var(--accent-glow);\n\n  /* overlays */\n  --overlay-scrim: oklch(0 0 0 / var(--opacity-scrim));\n  --overlay-scrim-strong: oklch(0 0 0 / var(--opacity-scrim-strong));\n\n  /* skeleton / loading */\n  --skeleton-base: var(--inset);\n  --skeleton-highlight: var(--card-2);\n\n  /* ════════════ COMPONENT TOKENS ════════════ */\n\n  /* Button · primary (the single green fill) */\n  --button-primary-surface: var(--accent);\n  --button-primary-surface-hover: var(--accent-bright);\n  --button-primary-text: var(--ink-inverse);\n  --button-primary-disabled-surface: var(--card-2);\n  --button-primary-disabled-text: var(--fg-faint);\n\n  /* Button · secondary (bordered) */\n  --button-secondary-surface: var(--card);\n  --button-secondary-surface-hover: var(--card-2);\n  --button-secondary-border: var(--line);\n  --button-secondary-text: var(--fg);\n\n  /* Button · ghost / destructive accents */\n  --button-ghost-surface-hover: var(--inset);\n  --button-danger-surface: var(--danger);\n  --button-danger-text: var(--ink-inverse);\n\n  /* Input / field */\n  --input-surface: var(--inset);\n  --input-border: var(--line);\n  --input-border-hover: var(--line-strong);\n  --input-border-focus: var(--accent-line);\n  --input-border-error: var(--danger);\n  --input-text: var(--fg);\n  --input-placeholder: var(--fg-muted);\n  --input-ring-focus: var(--accent-glow);\n\n  /* Card / window */\n  --card-surface: var(--card);\n  --card-border: var(--line);\n  --card-shadow: var(--shadow-card);\n  --card-shadow-raised: var(--shadow-pop);\n\n  /* Modal / sheet / drawer */\n  --modal-surface: var(--card);\n  --modal-border: var(--line);\n  --modal-backdrop: var(--overlay-scrim);\n  --modal-shadow: var(--shadow-pop);\n\n  /* Popover / tooltip / menu */\n  --popover-surface: var(--surface);\n  --popover-border: var(--line);\n  --popover-shadow: var(--shadow-pop);\n  --tooltip-surface: var(--card-2);\n  --tooltip-text: var(--fg);\n  --menu-item-surface-hover: var(--card);\n\n  /* Toast / banner */\n  --toast-surface: var(--card);\n  --toast-border: var(--line);\n  --toast-shadow: var(--shadow-pop);\n\n  /* AI / agent surfaces */\n  --ai-response-surface: var(--surface);\n  --ai-response-border: var(--line-soft);\n  --ai-thinking-indicator: var(--accent-text);\n  --ai-streaming-cursor: var(--accent);\n  --ai-source-border: var(--accent-line);\n  --ai-source-surface: var(--accent-dim);\n  --ai-tool-surface: var(--inset);\n  --ai-tool-border: var(--line);\n  --ai-confidence-high: var(--ok);\n  --ai-confidence-medium: var(--warn);\n  --ai-confidence-low: var(--danger);\n  --ai-permission-surface: var(--feedback-warning-surface);\n  --ai-permission-border: color-mix(in oklch, var(--warn) 40%, transparent);\n\n  /* Table / data */\n  --table-header-text: var(--fg-faint);\n  --table-header-surface: var(--card-2);\n  --table-row-border: var(--line-soft);\n  --table-row-surface-hover: var(--card);\n  --table-row-surface-selected: var(--accent-dim);\n  --table-foot-surface: var(--card-2);\n  --table-sort-indicator: var(--accent-text);\n  --table-num-text: var(--fg);\n\n  /* Navigation */\n  --nav-surface: var(--surface);\n  --nav-item-text: var(--fg-muted);\n  --nav-item-text-active: var(--fg);\n  --nav-item-surface-active: var(--card);\n  --nav-item-indicator: var(--accent-text);\n\n  /* Checkbox / radio */\n  --checkbox-surface: var(--inset);\n  --checkbox-border: var(--line);\n  --checkbox-surface-selected: var(--accent-solid);\n  --checkbox-mark: var(--accent-solid-ink);\n  --radio-surface: var(--inset);\n  --radio-border: var(--line);\n  --radio-border-selected: var(--accent);\n  --radio-dot: var(--accent-solid);\n\n  /* Slider */\n  --slider-track: var(--inset);\n  --slider-fill: var(--accent-solid);\n  --slider-thumb: var(--accent-bright);\n  --slider-thumb-ring: var(--accent-line);\n  --slider-thumb-border: var(--bg);\n\n  /* Stepper / number */\n  --stepper-surface: var(--card);\n  --stepper-border: var(--line);\n  --stepper-button-text: var(--fg-muted);\n  --stepper-button-surface-hover: var(--card-2);\n  --stepper-input-surface: var(--inset);\n\n  /* Combobox */\n  --combobox-surface: var(--card);\n  --combobox-border: var(--line);\n  --combobox-list-surface: var(--surface);\n  --combobox-list-border: var(--line);\n  --combobox-option-surface-hover: var(--card);\n  --combobox-option-selected-mark: var(--accent-text);\n\n  /* Tag input */\n  --tag-surface: var(--accent-dim);\n  --tag-border: var(--accent-line);\n  --tag-text: var(--accent-on-tint);\n\n  /* File upload */\n  --file-dropzone-surface: var(--inset);\n  --file-dropzone-border: var(--line);\n  --file-dropzone-border-active: var(--accent-line);\n  --file-progress: var(--accent);\n  --file-item-surface: var(--card);\n\n  /* Date field */\n  --date-surface: var(--inset);\n  --date-border: var(--line);\n  --date-segment-surface-active: var(--accent-dim);\n  --date-segment-text-active: var(--accent-text);\n\n  /* Breadcrumb / pagination / context menu / steps */\n  --breadcrumb-text: var(--fg-muted);\n  --breadcrumb-text-current: var(--fg);\n  --breadcrumb-surface-hover: var(--card-2);\n  --pagination-text: var(--fg-muted);\n  --pagination-surface-hover: var(--card-2);\n  --pagination-surface-current: var(--accent-dim);\n  --pagination-text-current: var(--accent-on-tint);\n  --pagination-border-current: var(--accent-line);\n  --tab-underline-indicator: var(--accent-text);\n  --context-item-text: var(--fg-muted);\n  --context-item-surface-hover: var(--card);\n  --context-item-text-danger: var(--danger);\n  --step-dot-surface: var(--card);\n  --step-dot-border: var(--line);\n  --step-dot-surface-done: var(--accent-solid);\n  --step-dot-text-done: var(--accent-solid-ink);\n  --step-dot-border-active: var(--accent);\n  --step-line: var(--line);\n  --step-line-done: var(--accent);\n\n  /* Data-viz structure */\n  --viz-gridline: var(--line-soft);\n  --viz-axis-text: var(--fg-faint);\n  --viz-tooltip-surface: var(--card-2);\n  --viz-tooltip-value: var(--fg);\n}\n\n/* ───────────── density · compact ───────────── */\n[data-density=\"compact\"] {\n  --control-height: 30px;\n  --control-height-sm: 24px;\n  --control-height-lg: 34px;\n  --control-pad-x: 11px;\n  --row-pad-y: 6px;\n  --row-pad-x: 10px;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   editor.css — Keiko Editor theme tokens (--ed-*).\n   EXTENDS the base palette — it does not fork it. Editor chrome reuses\n   --bg / --fg / --danger / --warn / --info; only the syntax palette and\n   editor-specific chrome / diff / ghost-text are net-new.\n   Variants: dark (:root) · light · high-contrast (media + [data-hc]).\n   ============================================================ */\n:root {\n  --ed-bg: oklch(0.16 0.004 160);\n  --ed-bg-gutter: oklch(0.16 0.004 160);\n  --ed-fg: #c5cdd9;\n\n  --ed-syn-comment:  #7d8ba5;\n  --ed-syn-string:   #c3e88d;\n  --ed-syn-number:   #f78c6c;\n  --ed-syn-constant: #f78c6c;\n  --ed-syn-keyword:  #c792ea;\n  --ed-syn-type:     #ffcb6b;\n  --ed-syn-function: #82aaff;\n  --ed-syn-property: #80cbc4;\n  --ed-syn-variable: #c5cdd9;\n  --ed-syn-operator: #89ddff;\n  --ed-syn-punct:    #89ddff;\n  --ed-syn-regexp:   #e9a3a3;\n\n  --ed-gutter-fg:        color-mix(in oklch, var(--fg) 38%, transparent);\n  --ed-gutter-fg-active: var(--fg-muted);\n  --ed-line-active:      color-mix(in oklch, var(--fg) 5%, transparent);\n  --ed-cursor:           var(--fg);\n  --ed-selection:        color-mix(in oklch, var(--accent) 26%, transparent);\n  --ed-bracket-match:    var(--accent-line);\n  --ed-indent-guide:     var(--line-soft);\n\n  --ed-diff-ins-line: color-mix(in oklch, oklch(0.72 0.16 150) 15%, transparent);\n  --ed-diff-ins-gutter: oklch(0.72 0.13 150);\n  --ed-diff-rem-line: color-mix(in oklch, var(--danger) 15%, transparent);\n  --ed-diff-rem-gutter: var(--danger);\n\n  --ed-error: var(--danger);\n  --ed-warn:  var(--warn);\n  --ed-info:  var(--info);\n  --ed-ghost: var(--fg-dim);\n\n  --ed-tab-bg:          var(--surface);\n  --ed-tab-active-bg:   var(--ed-bg);\n  --ed-tab-active-fg:   var(--fg);\n  --ed-tab-inactive-fg: var(--fg-faint);\n  --ed-tab-accent:      var(--accent);\n  --ed-statusbar-bg:    var(--surface);\n  --ed-statusbar-fg:    var(--fg-muted);\n  --ed-statusbar-accent:var(--accent-text);\n  --ed-minimap-slider:  color-mix(in oklch, var(--fg) 10%, transparent);\n\n  --ed-run-glyph:    var(--accent-text);\n  --ed-breakpoint:   var(--danger);\n  --ed-vcs-added:    var(--ed-diff-ins-gutter);\n  --ed-vcs-modified: var(--info);\n\n  /* agent-in-editor */\n  --ed-agent-line:   color-mix(in oklch, var(--accent) 12%, transparent);\n  --ed-agent-gutter: var(--accent-text);\n  --ed-agent-chip-bg:   var(--accent-dim);\n  --ed-agent-chip-line: var(--accent-line);\n}\n\n[data-theme=\"light\"] {\n  --ed-bg: oklch(0.985 0.003 160);\n  --ed-bg-gutter: oklch(0.985 0.003 160);\n  --ed-fg: #2b3440;\n  --ed-syn-comment:  #5a6675;\n  --ed-syn-string:   #2c7430;\n  --ed-syn-number:   #a8480a;\n  --ed-syn-constant: #a8480a;\n  --ed-syn-keyword:  #8b2bb8;\n  --ed-syn-type:     #856000;\n  --ed-syn-function: #235fc0;\n  --ed-syn-property: #0e6b66;\n  --ed-syn-variable: #2b3440;\n  --ed-syn-operator: #0f7491;\n  --ed-syn-punct:    #0f7491;\n  --ed-syn-regexp:   #a33b3b;\n  --ed-ghost: oklch(0.55 0.02 160);\n}\n\n@media (prefers-contrast: more) {\n  :root { --ed-bg: oklch(0.07 0.004 160); --ed-bg-gutter: oklch(0.07 0.004 160); --ed-fg: #ffffff;\n    --ed-syn-comment:#9bb0c9; --ed-syn-string:#b6f08a; --ed-syn-number:#ffb38a; --ed-syn-constant:#ffb38a;\n    --ed-syn-keyword:#d8b6ff; --ed-syn-type:#ffd479; --ed-syn-function:#9fc1ff; --ed-syn-property:#8fe0d8;\n    --ed-syn-variable:#e8edf3; --ed-syn-operator:#a6e9ff; --ed-syn-punct:#a6e9ff; --ed-syn-regexp:#f3b0b0; --ed-ghost: oklch(0.74 0.004 160); }\n  [data-theme=\"light\"] { --ed-bg: oklch(1 0 0); --ed-bg-gutter: oklch(1 0 0); --ed-fg: #000000;\n    --ed-syn-comment:#46525f; --ed-syn-string:#1a5d1d; --ed-syn-number:#8a3600; --ed-syn-constant:#8a3600;\n    --ed-syn-keyword:#6f1b96; --ed-syn-type:#5f4200; --ed-syn-function:#143f8f; --ed-syn-property:#0a5c57;\n    --ed-syn-variable:#000000; --ed-syn-operator:#0a5e75; --ed-syn-punct:#0a5e75; --ed-syn-regexp:#8a2020; --ed-ghost: oklch(0.42 0.01 160); }\n}\n[data-hc=\"more\"] { --ed-bg: oklch(0.07 0.004 160); --ed-bg-gutter: oklch(0.07 0.004 160); --ed-fg: #ffffff;\n  --ed-syn-comment:#9bb0c9; --ed-syn-string:#b6f08a; --ed-syn-number:#ffb38a; --ed-syn-constant:#ffb38a;\n  --ed-syn-keyword:#d8b6ff; --ed-syn-type:#ffd479; --ed-syn-function:#9fc1ff; --ed-syn-property:#8fe0d8;\n  --ed-syn-variable:#e8edf3; --ed-syn-operator:#a6e9ff; --ed-syn-punct:#a6e9ff; --ed-syn-regexp:#f3b0b0; --ed-ghost: oklch(0.74 0.004 160); }\n[data-hc=\"more\"][data-theme=\"light\"] { --ed-bg: oklch(1 0 0); --ed-bg-gutter: oklch(1 0 0); --ed-fg: #000000;\n  --ed-syn-comment:#46525f; --ed-syn-string:#1a5d1d; --ed-syn-number:#8a3600; --ed-syn-constant:#8a3600;\n  --ed-syn-keyword:#6f1b96; --ed-syn-type:#5f4200; --ed-syn-function:#143f8f; --ed-syn-property:#0a5c57;\n  --ed-syn-variable:#000000; --ed-syn-operator:#0a5e75; --ed-syn-punct:#0a5e75; --ed-syn-regexp:#8a2020; --ed-ghost: oklch(0.42 0.01 160); }\n<\u002Fstyle>\n  <style>/* ============================================================\n   surfaces.css — Keiko board + window shells and the signature\n   window controls (Kerf · Ductus · Lift). Lifted from the\n   primitive layer; consumed by the Window/Card component and the\n   workspace UI kit.\n   ============================================================ */\n\n/* ===== board shells ===================================================== */\n.kx {\n  height: 100%;\n  font-family: var(--font-ui);\n  color: var(--fg);\n  box-sizing: border-box;\n}\n.kx *, .kx *::before, .kx *::after { box-sizing: border-box; }\n\n.kx-bg      { background: var(--bg); }\n.kx-surface { background: var(--surface); }\n.kx-card    { background: var(--card); }\n\n/* the dot-grid surface — the canvas the workspace sits on */\n.kx-grid-surface {\n  background-color: var(--bg);\n  background-image: radial-gradient(circle at 1px 1px, var(--grid-dot) 1px, transparent 0);\n  background-size: 24px 24px;\n}\n\n/* card / panel */\n.card {\n  background: var(--card);\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  box-shadow: 0 1px 0 0 oklch(1 0 0 / 0.03) inset, 0 8px 24px -14px rgba(0, 0, 0, 0.6);\n}\n\n/* ===== window mock ====================================================== */\n.kx-win {\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  background: var(--card);\n  box-shadow: 0 1px 0 0 oklch(1 0 0 / 0.03) inset, 0 8px 24px -12px rgba(0, 0, 0, 0.6);\n  overflow: hidden;\n}\n.kx-win.active { box-shadow: var(--shadow-pop); border-color: var(--accent-line); }\n.kx-winhead {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  height: 38px;\n  padding: 0 6px 0 12px;\n  border-bottom: 1px solid var(--line-soft);\n}\n.kx-winhead .kx-ico { display: grid; place-items: center; color: var(--fg-dim); }\n.kx-wintitle { font-size: 13.5px; font-weight: 650; color: var(--fg); }\n.kx-winsub {\n  font-size: 11px;\n  font-weight: 500;\n  color: var(--fg-muted);\n  background: var(--inset);\n  padding: 2px 7px;\n  border-radius: 6px;\n}\n.kx-grow { flex: 1; }\n.kx-winbody { padding: 15px; display: flex; flex-direction: column; gap: 9px; }\n.kx-skel { height: 8px; border-radius: 5px; background: var(--inset); }\n.kx-skel.s1 { width: 64%; }\n.kx-skel.s2 { width: 86%; }\n.kx-skel.s3 { width: 40%; }\n\n/* ===== window controls (Lift signature) ================================= */\n.kx-controls { display: flex; align-items: center; gap: 3px; }\n.kx-ctl {\n  position: relative;\n  display: grid;\n  place-items: center;\n  border: 0;\n  background: transparent;\n  cursor: pointer;\n  color: var(--fg-faint);\n  transition: color 0.12s;\n}\n.kx-ctl svg { position: relative; z-index: 1; overflow: visible; }\n.kx-chip {\n  position: absolute;\n  inset: 3px;\n  border-radius: 7px;\n  opacity: 0;\n  transition: opacity 0.12s, transform 0.12s;\n}\n.kx-ctl:hover, .kx-ctl[data-force=\"hover\"] { color: var(--fg); }\n.kx-ctl:hover .kx-chip, .kx-ctl[data-force=\"hover\"] .kx-chip { opacity: 1; }\n.kx-ctl[data-act=\"max\"]:hover, .kx-ctl[data-act=\"max\"][data-force=\"hover\"]   { color: var(--accent-text); }\n.kx-ctl[data-act=\"close\"]:hover, .kx-ctl[data-act=\"close\"][data-force=\"hover\"] { color: var(--danger); }\n\n/* — Kerf: chamfered chip, the cut-corner signature — */\n.kx-ctl[data-dir=\"kerf\"] .kx-chip {\n  background: var(--card-2);\n  clip-path: polygon(0 0, 70% 0, 100% 32%, 100% 100%, 0 100%);\n  box-shadow: inset 0 0 0 1px var(--line);\n}\n.kx-ctl[data-dir=\"kerf\"][data-act=\"max\"] .kx-chip   { box-shadow: inset 0 0 0 1px var(--accent-line); }\n.kx-ctl[data-dir=\"kerf\"][data-act=\"close\"] .kx-chip { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--danger) 55%, transparent); }\n\n/* — Ductus: soft round chip — */\n.kx-ctl[data-dir=\"ductus\"] .kx-chip { background: var(--card-2); border-radius: 50%; }\n.kx-ctl[data-dir=\"ductus\"][data-act=\"max\"] .kx-chip   { background: color-mix(in oklch, var(--accent) 14%, var(--card-2)); }\n.kx-ctl[data-dir=\"ductus\"][data-act=\"close\"] .kx-chip { background: color-mix(in oklch, var(--danger) 14%, var(--card-2)); }\n\n/* — Lift: ring halo (the chosen signature) — */\n.kx-ctl[data-dir=\"lift\"] .kx-chip {\n  background: transparent;\n  border-radius: 50%;\n  box-shadow: 0 0 0 1px var(--line-soft) inset;\n}\n.kx-ctl[data-dir=\"lift\"]:hover .kx-chip,\n.kx-ctl[data-dir=\"lift\"][data-force=\"hover\"] .kx-chip {\n  box-shadow: 0 0 0 1px var(--line) inset, 0 0 0 4px var(--accent-glow);\n}\n.kx-ctl[data-dir=\"lift\"][data-act=\"close\"]:hover .kx-chip,\n.kx-ctl[data-dir=\"lift\"][data-act=\"close\"][data-force=\"hover\"] .kx-chip {\n  box-shadow: 0 0 0 1px var(--line) inset, 0 0 0 4px color-mix(in oklch, var(--danger) 26%, transparent);\n}\n.kx-ctl[data-act=\"min\"]:active .kx-chip,\n.kx-ctl[data-act=\"max\"]:active .kx-chip,\n.kx-ctl[data-act=\"close\"]:active .kx-chip { transform: scale(0.92); }\n<\u002Fstyle>\n  <style>/* ============================================================\n   components.css — Keiko component library (class layer).\n   Every declaration resolves to the tier-2/3 token layer\n   (semantic.css). React components emit these class names.\n   ============================================================ */\n.ico { display: inline-grid; place-items: center; }\n\n/* demo scaffolding */\n.demo-card { padding: 26px 28px; }\n.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }\n.demo-stack { display: flex; flex-direction: column; gap: 12px; }\n.demo-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 14px; }\n.cls { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-accent); }\n.muted-cap { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }\n\n/* ── buttons ─────────────────────────────────────────────── */\n.c-btn {\n  display: inline-flex; align-items: center; gap: 7px;\n  height: var(--control-height); padding: 0 var(--control-pad-x);\n  border-radius: var(--radius-control);\n  border: 1px solid var(--button-secondary-border);\n  background: var(--button-secondary-surface);\n  color: var(--button-secondary-text);\n  font: var(--weight-medium) 13px var(--font-ui);\n  cursor: pointer;\n  transition: border-color 0.13s, background 0.13s, transform 0.06s;\n}\n.c-btn:hover { border-color: var(--border-strong); }\n.c-btn:active { transform: translateY(0.5px); }\n.c-btn:disabled { opacity: var(--opacity-disabled); cursor: not-allowed; }\n.c-btn--primary { background: var(--button-primary-surface); border-color: transparent; color: var(--button-primary-text); font-weight: var(--weight-semibold); }\n.c-btn--primary:hover { background: var(--button-primary-surface-hover); border-color: transparent; }\n.c-btn--accent { background: var(--surface-accent-subtle); border-color: var(--border-accent); color: var(--accent-on-tint); }\n.c-btn--accent:hover { background: var(--surface-accent-glow); border-color: var(--action-primary); }\n.c-btn--ghost { background: transparent; border-color: transparent; color: var(--action-tertiary-text); }\n.c-btn--ghost:hover { background: var(--surface-secondary); color: var(--text-primary); border-color: transparent; }\n.c-btn--danger { background: transparent; border-color: color-mix(in oklch, var(--feedback-danger) 45%, transparent); color: var(--feedback-danger); }\n.c-btn--danger:hover { background: color-mix(in oklch, var(--feedback-danger) 14%, transparent); }\n.c-btn--danger-solid { background: var(--feedback-danger); border-color: transparent; color: var(--ink-inverse); font-weight: var(--weight-semibold); }\n.c-btn--sm { height: var(--control-height-sm); padding: 0 10px; font-size: 12px; }\n.c-btn--lg { height: var(--control-height-lg); padding: 0 18px; font-size: 14px; }\n.c-iconbtn {\n  width: 32px; height: 32px; display: grid; place-items: center;\n  border-radius: var(--radius-control); border: 1px solid transparent;\n  background: transparent; color: var(--text-secondary); cursor: pointer; transition: background 0.13s, color 0.13s;\n}\n.c-iconbtn:hover { background: var(--surface-secondary); color: var(--text-primary); }\n.c-iconbtn--sm { width: 28px; height: 28px; }\n\n/* ── form controls ───────────────────────────────────────── */\n.c-field {\n  width: 100%;\n  padding: 9px 12px;\n  border-radius: var(--radius-control);\n  border: 1px solid var(--border-subtle);\n  background: var(--input-surface);\n  color: var(--input-text);\n  font: 13px var(--font-ui);\n  outline: none;\n  transition: border-color 0.13s, box-shadow 0.13s;\n}\n.c-field::placeholder { color: var(--input-placeholder); }\n.c-field:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--input-ring-focus); }\n.c-field--area { resize: vertical; min-height: 88px; line-height: 1.5; }\n.c-search { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: var(--radius-control); background: var(--input-surface); border: 1px solid var(--border-subtle); color: var(--text-faint); }\n.c-search:focus-within { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--input-ring-focus); }\n.c-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--input-text); font: 13px var(--font-ui); }\n.c-select { position: relative; display: inline-flex; align-items: center; }\n.c-select select {\n  appearance: none; -webkit-appearance: none;\n  padding: 9px 36px 9px 12px;\n  border-radius: var(--radius-control); border: 1px solid var(--input-border); background: var(--surface-primary); color: var(--text-primary);\n  font: 13px var(--font-ui); cursor: pointer; outline: none;\n}\n.c-select select:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--input-ring-focus); }\n.c-select .chev { position: absolute; right: 11px; pointer-events: none; color: var(--text-faint); }\n.c-label { display: block; font-size: 11px; font-weight: var(--weight-semibold); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px; }\n\n/* ── toggle ──────────────────────────────────────────────── */\n.c-toggle { width: 42px; height: 24px; border-radius: var(--radius-pill); background: var(--surface-inset); border: 1px solid var(--border-default); position: relative; cursor: pointer; padding: 0; flex: none; transition: background 0.15s, border-color 0.15s; }\n.c-toggle span { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--text-primary); transition: left 0.16s, background 0.15s; }\n.c-toggle[aria-checked=\"true\"] { background: var(--surface-accent-subtle); border-color: var(--border-accent); }\n.c-toggle[aria-checked=\"true\"] span { left: 20px; background: var(--accent-bright); }\n.c-switchrow { display: flex; align-items: center; gap: 12px; }\n.c-switchrow .t { font-size: 13px; color: var(--text-primary); }\n\n/* ── tabs (segmented) ────────────────────────────────────── */\n.c-tabs { display: inline-flex; align-items: center; gap: 4px; }\n.c-tab { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: var(--radius-control); font: 13px var(--font-ui); color: var(--nav-item-text); border: 1px solid transparent; background: transparent; cursor: pointer; }\n.c-tab:hover { color: var(--nav-item-text-active); }\n.c-tab[aria-selected=\"true\"] { background: var(--nav-item-surface-active); color: var(--nav-item-text-active); border-color: var(--border-subtle); }\n.c-seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-inset); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }\n.c-seg button { padding: 5px 12px; border: 0; background: transparent; color: var(--text-secondary); border-radius: 6px; font: 12.5px var(--font-ui); cursor: pointer; }\n.c-seg button[aria-selected=\"true\"] { background: var(--surface-secondary); color: var(--text-primary); }\n\n/* ── underline tabs ──────────────────────────────────────── */\n.c-utabs { display: inline-flex; align-items: stretch; gap: 2px; border-bottom: 1px solid var(--border-subtle); }\n.c-utab { position: relative; padding: 9px 13px; border: 0; background: transparent; color: var(--nav-item-text); font: 13px var(--font-ui); cursor: pointer; }\n.c-utab:hover { color: var(--nav-item-text-active); }\n.c-utab[aria-selected=\"true\"] { color: var(--nav-item-text-active); }\n.c-utab[aria-selected=\"true\"]::after { content: \"\"; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px 2px 0 0; background: var(--tab-underline-indicator); }\n\n/* ── chips / badges / status ─────────────────────────────── */\n.c-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: var(--radius-control); font-size: 12.5px; color: var(--text-secondary); background: var(--surface-primary); border: 1px solid var(--border-subtle); }\n.c-chip:hover { border-color: var(--border-default); color: var(--text-primary); }\n.c-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--radius-pill); font: var(--weight-semibold) 11px var(--font-ui); border: 1px solid var(--border-subtle); color: var(--text-secondary); background: var(--surface-inset); }\n.c-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }\n.c-badge--ok { color: var(--feedback-success); border-color: color-mix(in oklch, var(--feedback-success) 40%, transparent); background: color-mix(in oklch, var(--feedback-success) 12%, transparent); }\n.c-badge--ok .dot { background: var(--feedback-success); }\n.c-badge--warn { color: var(--feedback-warning); border-color: color-mix(in oklch, var(--feedback-warning) 40%, transparent); background: color-mix(in oklch, var(--feedback-warning) 12%, transparent); }\n.c-badge--warn .dot { background: var(--feedback-warning); }\n.c-badge--info { color: var(--feedback-info); border-color: color-mix(in oklch, var(--feedback-info) 40%, transparent); background: color-mix(in oklch, var(--feedback-info) 12%, transparent); }\n.c-badge--info .dot { background: var(--feedback-info); }\n.c-badge--danger { color: var(--feedback-danger); border-color: color-mix(in oklch, var(--feedback-danger) 40%, transparent); background: color-mix(in oklch, var(--feedback-danger) 12%, transparent); }\n.c-badge--danger .dot { background: var(--feedback-danger); }\n.c-badge--accent { color: var(--accent-on-tint); border-color: var(--border-accent); background: var(--surface-accent-subtle); }\n.c-badge--accent .dot { background: var(--accent); }\n.c-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--radius-pill); border: 1px solid var(--border-subtle); font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; }\n\n/* ── avatar ──────────────────────────────────────────────── */\n.c-avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-accent-subtle); color: var(--accent-on-tint); border: 1px solid var(--border-accent); font: var(--weight-semibold) 12px var(--font-ui); flex: none; overflow: hidden; }\n.c-avatar img { width: 100%; height: 100%; object-fit: cover; }\n.c-avatar--sm { width: 24px; height: 24px; font-size: 10px; }\n.c-avatar--lg { width: 44px; height: 44px; font-size: 15px; }\n\n/* ── tool rail ───────────────────────────────────────────── */\n.c-rail { width: 50px; background: var(--nav-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-surface); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 5px; }\n.c-rail-btn { position: relative; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--text-tertiary); border: 0; background: transparent; cursor: pointer; }\n.c-rail-btn:hover { background: var(--nav-item-surface-active); color: var(--text-primary); }\n.c-rail-btn[aria-current=\"true\"] { background: var(--nav-item-surface-active); color: var(--nav-item-indicator); }\n.c-rail-btn[aria-current=\"true\"]::before { content: \"\"; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--nav-item-indicator); }\n.c-rail-new { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--accent-on-tint); border: 1px solid var(--border-accent); background: var(--surface-accent-subtle); cursor: pointer; }\n.c-rail-new:hover { background: var(--surface-accent-glow); border-color: var(--action-primary); }\n.c-rail-div { width: 22px; height: 1px; background: var(--border-subtle); margin: 6px 0; }\n.c-rail-avatar { width: 28px; height: 28px; margin-top: 4px; border-radius: 50%; background: var(--surface-accent-subtle); color: var(--accent-on-tint); display: grid; place-items: center; font: 700 11px var(--font-ui); border: 1px solid var(--border-accent); }\n\n/* ── file tree ───────────────────────────────────────────── */\n.c-tree { padding: 8px; min-width: 240px; }\n.c-tree-row { display: flex; align-items: center; gap: 7px; width: 100%; padding: var(--row-pad-y) var(--row-pad-x); border-radius: 7px; font: 13.5px var(--font-ui); color: var(--text-secondary); text-align: left; border: 0; background: transparent; cursor: pointer; }\n.c-tree-row:hover { background: var(--surface-secondary); color: var(--text-primary); }\n.c-tree-row[aria-current=\"true\"] { background: var(--surface-accent-subtle); color: var(--text-primary); }\n.c-tree-row .caret { color: var(--text-faint); transition: transform 0.12s; display: inline-grid; place-items: center; }\n.c-tree-row.open .caret { transform: rotate(90deg); }\n.c-tree-row.folder { color: var(--text-primary); font-weight: var(--weight-semibold); }\n.c-tree-row .sz { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }\n.c-tree-indent { padding-left: 24px; }\n\n/* ── menu / dropdown ─────────────────────────────────────── */\n.c-menu { width: 220px; background: var(--popover-surface); border: 1px solid var(--popover-border); border-radius: var(--radius-surface); box-shadow: var(--popover-shadow); padding: 6px; }\n.c-menu-head { font-size: 10.5px; color: var(--text-secondary); padding: 6px 8px 8px; font-family: var(--font-mono); letter-spacing: 0.04em; }\n.c-menu-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 9px; border-radius: var(--radius-control); text-align: left; font: 13.5px var(--font-ui); color: var(--text-secondary); border: 0; background: transparent; cursor: pointer; }\n.c-menu-item:hover { background: var(--menu-item-surface-hover); color: var(--text-primary); }\n.c-menu-item.danger { color: var(--context-item-text-danger); }\n.c-menu-item .k { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }\n.c-menu-sep { height: 1px; background: var(--border-subtle); margin: 4px 2px; }\n\n/* ── tooltip ─────────────────────────────────────────────── */\n.c-tooltip { display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 7px; background: var(--tooltip-surface); color: var(--tooltip-text); border: 1px solid var(--border-default); font-size: 12px; box-shadow: var(--popover-shadow); white-space: nowrap; }\n\n/* ── toast / alert ───────────────────────────────────────── */\n.c-toast { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-surface); background: var(--toast-surface); border: 1px solid var(--toast-border); box-shadow: var(--toast-shadow); max-width: 420px; }\n.c-toast .tx { flex: 1; min-width: 0; }\n.c-toast .tt { display: block; font-size: 13px; font-weight: var(--weight-semibold); color: var(--text-primary); }\n.c-toast .ts { display: block; font-size: 12px; color: var(--text-secondary); margin-top: 1px; }\n.c-toast .ic { width: 30px; height: 30px; border-radius: var(--radius-control); display: grid; place-items: center; flex: none; background: var(--surface-accent-subtle); color: var(--accent-on-tint); border: 1px solid var(--border-accent); }\n.c-alert { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: var(--radius-control); font-size: 12.5px; line-height: 1.45; color: var(--text-primary); }\n.c-alert--danger { border: 1px solid color-mix(in oklch, var(--feedback-danger) 48%, transparent); background: color-mix(in oklch, var(--feedback-danger) 18%, var(--surface-primary)); }\n.c-alert--ok { border: 1px solid color-mix(in oklch, var(--feedback-success) 42%, transparent); background: color-mix(in oklch, var(--feedback-success) 12%, transparent); }\n\n/* ── composer ────────────────────────────────────────────── */\n.c-composer { background: var(--card-surface); border: 1px solid var(--card-border); border-radius: var(--radius-floating); padding: 13px 14px 10px; box-shadow: var(--card-shadow); }\n.c-composer:focus-within { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--input-ring-focus), var(--card-shadow); }\n.c-composer textarea { width: 100%; border: 0; background: none; resize: none; outline: none; color: var(--text-primary); font: 15px/1.5 var(--font-ui); }\n.c-composer textarea::placeholder { color: var(--input-placeholder); }\n.c-composer-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }\n.c-composer-send { width: var(--control-height); height: var(--control-height); margin-left: auto; border-radius: 10px; display: grid; place-items: center; border: 0; cursor: pointer; color: var(--button-primary-text); background: var(--button-primary-surface); }\n.c-composer-send:hover { background: var(--button-primary-surface-hover); }\n\n/* ── messages & feedback ─────────────────────────────────── */\n.c-msg { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: var(--radius-control); border: 1px solid var(--border-default); background: var(--surface-primary); }\n.c-msg-ico { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--text-tertiary); background: color-mix(in oklch, var(--text-tertiary) 15%, transparent); }\n.c-msg--danger { border-color: color-mix(in oklch, var(--feedback-danger) 40%, var(--border-default)); background: color-mix(in oklch, var(--feedback-danger) 8%, var(--surface-primary)); }\n.c-msg--danger .c-msg-ico { color: var(--feedback-danger); background: color-mix(in oklch, var(--feedback-danger) 15%, transparent); }\n.c-msg--warn { border-color: color-mix(in oklch, var(--feedback-warning) 40%, var(--border-default)); background: color-mix(in oklch, var(--feedback-warning) 8%, var(--surface-primary)); }\n.c-msg--warn .c-msg-ico { color: var(--feedback-warning); background: color-mix(in oklch, var(--feedback-warning) 15%, transparent); }\n.c-msg--info { border-color: color-mix(in oklch, var(--feedback-info) 40%, var(--border-default)); background: color-mix(in oklch, var(--feedback-info) 8%, var(--surface-primary)); }\n.c-msg--info .c-msg-ico { color: var(--feedback-info); background: color-mix(in oklch, var(--feedback-info) 15%, transparent); }\n.c-msg--ok { border-color: color-mix(in oklch, var(--feedback-success) 40%, var(--border-default)); background: color-mix(in oklch, var(--feedback-success) 8%, var(--surface-primary)); }\n.c-msg--ok .c-msg-ico { color: var(--feedback-success); background: color-mix(in oklch, var(--feedback-success) 15%, transparent); }\n.c-msg-bd { flex: 1; min-width: 0; }\n.c-msg-tt { font: var(--weight-semibold) 13px var(--font-ui); color: var(--text-primary); }\n.c-msg-tx { font-size: 12.5px; line-height: 1.5; color: var(--text-secondary); margin-top: 2px; }\n.c-msg-tx code { font-family: var(--font-mono); font-size: 12px; color: var(--text-accent); }\n.c-msg-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }\n.c-msg-close { flex: none; width: 26px; height: 26px; margin: -2px -5px 0 0; display: grid; place-items: center; border: 0; background: transparent; color: var(--text-faint); border-radius: 7px; cursor: pointer; transition: background 0.12s, color 0.12s; }\n.c-msg-close:hover { background: color-mix(in oklch, var(--text-primary) 9%, transparent); color: var(--text-primary); }\n\n/* full-width banner — top of a window/surface */\n.c-banner { display: flex; align-items: center; gap: 11px; padding: 11px 15px; border: 0; border-bottom: 1px solid color-mix(in oklch, var(--feedback-info) 42%, var(--border-default)); background: color-mix(in oklch, var(--feedback-info) 10%, var(--surface-primary)); font-size: 13px; color: var(--text-primary); }\n.c-banner .c-msg-ico { width: 20px; height: 20px; background: transparent; border-radius: 0; color: var(--feedback-info); }\n.c-banner .gw { flex: 1; min-width: 0; }\n.c-banner--danger { border-bottom-color: color-mix(in oklch, var(--feedback-danger) 42%, var(--border-default)); background: color-mix(in oklch, var(--feedback-danger) 10%, var(--surface-primary)); }\n.c-banner--danger .c-msg-ico { color: var(--feedback-danger); }\n.c-banner--warn { border-bottom-color: color-mix(in oklch, var(--feedback-warning) 42%, var(--border-default)); background: color-mix(in oklch, var(--feedback-warning) 10%, var(--surface-primary)); }\n.c-banner--warn .c-msg-ico { color: var(--feedback-warning); }\n.c-banner--info { border-bottom-color: color-mix(in oklch, var(--feedback-info) 42%, var(--border-default)); background: color-mix(in oklch, var(--feedback-info) 10%, var(--surface-primary)); }\n.c-banner--info .c-msg-ico { color: var(--feedback-info); }\n.c-banner--ok { border-bottom-color: color-mix(in oklch, var(--feedback-success) 42%, var(--border-default)); background: color-mix(in oklch, var(--feedback-success) 10%, var(--surface-primary)); }\n.c-banner--ok .c-msg-ico { color: var(--feedback-success); }\n\n/* toast severities */\n.c-toast--danger .ic { color: var(--feedback-danger); background: color-mix(in oklch, var(--feedback-danger) 14%, var(--surface-primary)); border-color: color-mix(in oklch, var(--feedback-danger) 40%, transparent); }\n.c-toast--warn .ic { color: var(--feedback-warning); background: color-mix(in oklch, var(--feedback-warning) 14%, var(--surface-primary)); border-color: color-mix(in oklch, var(--feedback-warning) 40%, transparent); }\n.c-toast--info .ic { color: var(--feedback-info); background: color-mix(in oklch, var(--feedback-info) 14%, var(--surface-primary)); border-color: color-mix(in oklch, var(--feedback-info) 40%, transparent); }\n.c-toast--ok .ic { color: var(--feedback-success); background: color-mix(in oklch, var(--feedback-success) 14%, var(--surface-primary)); border-color: color-mix(in oklch, var(--feedback-success) 40%, transparent); }\n\n/* inline form validation */\n.c-field--invalid { border-color: color-mix(in oklch, var(--input-border-error) 60%, transparent); background: color-mix(in oklch, var(--input-border-error) 6%, var(--input-surface)); }\n.c-field--invalid:focus { border-color: var(--input-border-error); box-shadow: 0 0 0 3px color-mix(in oklch, var(--input-border-error) 24%, transparent); }\n.c-field-error { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 12px; color: var(--feedback-danger); }\n.c-field-error .ico { flex: none; }\n.c-field-hint { margin-top: 7px; font-size: 12px; color: var(--text-secondary); }\n<\u002Fstyle>\n  <style>/* ============================================================\n   styles.css — Keiko Design System entry point.\n   Consumers link this one file. @import lines only.\n   Three-tier token architecture + the component class layer.\n   ============================================================ */\n/* ============================================================\n   fonts.css — self-hosted JetBrains Mono (the one external font).\n   Offline-safe, no extra DNS/TLS hop, reproducible builds.\n   Woff2 from github.com/JetBrains/JetBrainsMono (OFL).\n   ============================================================ */\n@font-face {\n  font-family: \"JetBrains Mono\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"de7e90d0-d81f-4e08-aac6-a6601a46d180\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"JetBrains Mono\";\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e3becc72-ad54-44e3-b749-a5a4a3241604\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"JetBrains Mono\";\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"56a0a523-9f33-4a61-9552-0ca5d6fb31d8\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"JetBrains Mono\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"545e4335-f9c2-4e0a-ba30-c4693954720c\") format(\"woff2\");\n}\n\n/* ============================================================\n   primitives.css — KEIKO design tokens, lifted 1:1 from\n   packages/keiko-ui globals.css (dark theme).\n   Brand: #4EBA87 \"orca green\". Tier 1 of the token architecture.\n   ============================================================ */\n:root {\n  --bg: oklch(0.17 0.004 160);\n  --surface: oklch(0.205 0.004 160);\n  --card: oklch(0.235 0.004 160);\n  --card-2: oklch(0.265 0.004 160);\n  --inset: oklch(0.155 0.004 160);\n\n  --line: oklch(0.3 0.004 160);\n  --line-soft: oklch(0.26 0.004 160);\n  --line-strong: oklch(0.38 0.005 160);\n  --grid-dot: oklch(0.34 0.005 160);\n  --focus-w: 2px;\n\n  --fg: oklch(0.97 0.003 160);\n  --fg-muted: oklch(0.74 0.004 160);\n  --fg-dim: oklch(0.66 0.004 160);\n  --fg-faint: oklch(0.64 0.004 160);\n\n  --accent: oklch(0.72 0.124 160); /* brand \"orca green\" — was #4eba87, now oklch so the whole token system is single-space */\n  --accent-bright: oklch(0.78 0.13 160);\n  --accent-dim: color-mix(in oklch, #4eba87 18%, transparent);\n  --accent-line: color-mix(in oklch, #4eba87 40%, transparent);\n  --accent-glow: color-mix(in oklch, #4eba87 26%, transparent);\n  /* text-tone alias — equals --accent in dark; darkened to ≥4.5:1 on white in light */\n  --accent-text: var(--accent);\n  /* accessibility-tuned accent roles (measured live on a11y-audit.html) */\n  --accent-solid: var(--accent);          /* accent FILL with no text (checkbox/slider/step dot) — ≥3:1 vs surface */\n  --accent-solid-ink: var(--ink-inverse); /* the mark/glyph sitting on --accent-solid */\n  --accent-on-tint: var(--accent-text);   /* accent TEXT on an accent tint (chips, citations) — ≥4.5:1 */\n  --ink-inverse: oklch(0.18 0.005 160);\n\n  --warn: oklch(0.78 0.13 75);\n  --danger: oklch(0.68 0.16 25);\n  --ok: oklch(0.74 0.13 146);      /* success — its own status green (hue 146), separable from the interactive accent (160) */\n  --info: oklch(0.74 0.1 240);\n\n  --radius: 14px;\n  --radius-sm: 9px;\n  --radius-lg: 18px;\n\n  --font-ui: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* elevation — defined for the DARK base too. */\n  --shadow-card: 0 1px 0 0 oklch(1 0 0 / 0.03) inset, 0 8px 24px -12px rgba(0, 0, 0, 0.6);\n  --shadow-pop: 0 18px 50px -18px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--line);\n}\n\n/* ===== LIGHT THEME — warm-neutral, same orca-green accent ===== */\n[data-theme=\"light\"] {\n  color-scheme: light;\n  --bg: oklch(0.955 0.004 160);\n  --surface: oklch(0.978 0.003 160);\n  --card: oklch(1 0 0);\n  --card-2: oklch(0.96 0.004 160);\n  --inset: oklch(0.945 0.005 160);\n  --line: oklch(0.88 0.006 160);\n  --line-soft: oklch(0.915 0.005 160);\n  --line-strong: oklch(0.8 0.008
