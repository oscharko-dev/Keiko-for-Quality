name: Keiko for Quality
description: >-
  Hardened pull-request reviewer. Publishes model-backed findings as native, resolvable review
  conversations bound to the exact reviewed head, with no raw review material in logs or artifacts.
author: oscharko-dev
branding:
  icon: shield
  color: blue

inputs:
  profile:
    description: >-
      Path to the review profile JSON, relative to the workspace. It declares which paths are
      review-relevant, which deletions are review-critical, which are generated, and every other
      exclusion with its justification. Read from the trusted base checkout.
    required: true

  guidelines:
    description: >-
      Optional newline- or comma-separated repository-relative paths to this repository's own
      written engineering guidance — AGENTS.md, CONTRIBUTING.md, a review-standards document.
      Read from the trusted base checkout and given to the reviewer as background, so a finding can
      cite the rule it rests on instead of arguing from general principle. At most 8 documents and
      64 KB in total; a missing path is skipped and recorded, never fatal.
    required: false
    default: ""

  model_endpoint:
    description: HTTPS endpoint of the model provider. Must be https.
    required: true
  model_id:
    description: Model identifier. Pin a provider snapshot where one is offered.
    required: true
  model_protocol:
    description: "Wire protocol: `openai` or `anthropic`."
    required: true
  model_token_env:
    description: >-
      NAME of the environment variable holding the model credential — not the credential itself.
      Set that variable from a secret in the job's `env:`. Passing the value as an input would put
      it in the step context, where every other action in the job can read it.
    required: true

  app_id:
    description: >-
      GitHub App id for the reviewer's own posting identity. Strongly recommended: deduplication
      only suppresses a repost when the existing conversation was authored by this reviewer, and a
      shared identity weakens that check.
    required: false
  app_private_key:
    description: GitHub App private key (PEM) used to mint a short-lived installation token.
    required: false
  github_token:
    description: >-
      Fallback token used only when no App credentials are supplied. Findings are then authored by
      the shared Actions identity.
    required: false
    default: ${{ github.token }}

  target_branches:
    description: Comma-separated base branches eligible for review.
    required: false
    default: dev
  language:
    description: Review output language.
    required: false
    default: English
  concurrency:
    description: Engine review concurrency.
    required: false
    default: "4"
  file_timeout_seconds:
    description: Per-file model timeout.
    required: false
    default: "300"
  review_timeout_seconds:
    description: Whole-review wall-clock ceiling.
    required: false
    default: "1800"
  token_budget:
    description: >-
      Hard ceiling for one review; exceeding it settles the run as incomplete. The adapter never
      spends this much by default — it passes the engine a per-run allotment scaled to the
      change's own size (file count and changed lines), capped at this ceiling, so the engine
      stops dispatching new files once projected spend crosses the smaller of the two.
    required: false
    default: "2000000"
  max_findings:
    description: >-
      Findings above this count are treated as implausible and settle the run as incomplete, on the
      basis that a flood is more likely a misconfigured model than a genuinely terrible change.
    required: false
    default: "50"
  rename_detection_percent:
    description: Git rename-detection similarity threshold.
    required: false
    default: "50"
  review_store_path:
    description: >-
      Optional path to a persisted review-cache store — a file, not a directory, typically restored
      from and saved back to a GitHub Actions cache around this step. A cache-eligible file whose
      exact base/head content, rule text, engine binary, model, and protocol match a stored entry is
      answered from that entry instead of re-sent to the model. Empty (the default) disables the
      feature entirely, with no other behavioural change. A missing or unreadable store is treated
      as empty and the run proceeds normally: memoization is a pure optimization layer, so its own
      failure never gates completeness, only re-review cost. A matching entry also replays only
      while the pull request's changed-file set stays the same shape it was when that entry was
      written — a new, deleted, or renamed path anywhere in the pull request invalidates it, bounding
      how stale a replay's repository context can be.
    required: false
    default: ""
  run_summary:
    description: >-
      Whether to maintain a single upserted run-summary comment on the pull request, in addition to
      finding conversations. `true` (the default) posts or updates one comment per run — for every
      settlement outcome, including incomplete and abandoned — stating the outcome, the reviewed
      head, and redacted counts. `false` disables it: no issue-comment API call is made at all.
    required: false
    default: "true"
  cross_artifact_pass:
    description: >-
      Experimental. Whether to spend one extra, bounded model call per run asking only cross-file
      contract questions — a producer shape a separately-declared consumer twin no longer covers, a
      union member no consumer branch mentions — over a summary of every changed file's exported
      declarations. Per-file review cannot see this defect class at all. `false` (the default)
      leaves it off: no extra call, no behavioural change. Promotion to on-by-default depends on a
      later qualification-corpus measurement, not on this input's mere existence.
    required: false
    default: "false"

outputs:
  outcome:
    description: "`complete`, `incomplete`, `abandoned`, or `skipped`. Never finding content."
  reason:
    description: Redacted reason code when the outcome is not complete.
  inventory_size:
    description: Number of changed paths classified.
  findings_published:
    description: Number of findings published as review conversations.
  findings_suppressed:
    description: Number of findings suppressed as already-open duplicates.
  store_written:
    description: >-
      `true` when this run persisted a review store at `review_store_path`, `false` otherwise.
      Not the same question as `outcome`: since a budget-truncated run keeps the verdicts it
      earned, a consumer that carries the store between runs must gate its hand-off on THIS
      output, not on `outcome == 'complete'` — otherwise a truncated run's store never leaves the
      runner and a large pull request re-prices every file on every push.
  cache_hits:
    description: >-
      Number of cache-eligible files served from `review_store_path` instead of the model. Always
      `0` when that input is empty.
  cache_misses:
    description: >-
      Number of cache-eligible files sent to the model despite a configured store (no matching
      entry). Always `0` when that input is empty.
  summary_comment_url:
    description: >-
      URL of the maintained run-summary comment, when `run_summary` is enabled and the upsert
      succeeded. Empty when disabled, when the upsert failed (never fails the run), or when the
      event was skipped at eligibility before a review was attempted.

runs:
  using: node24
  main: dist/index.js
