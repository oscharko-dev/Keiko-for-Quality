name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The reviewer runs inside other people's CI with a model credential and comment-write access.
# Every job below therefore declares only its own minimum authority; no workflow-wide grant can
# silently flow into a new job.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core_verify:
    name: core verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # Consumers execute dist/index.js, not src/. This proves the committed artifact is the one
      # this source produces, so a pinned action SHA actually pins reviewed code.
      - name: Verify committed bundle is reproducible
        run: npm run check:bundle

  engine-pin:
    name: engine pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # Downloads the pinned engine and verifies its digest. This is the supply-chain claim the
      # product makes to every consumer, so it is proved on every change rather than assumed.
      - name: Verify pinned engine digest
        run: npm run check:engine-pin

  action-smoke:
    name: action smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Proves the committed bundle actually executes under the node24 action runtime, against a
      # real GitHub event payload. Every other job runs the TypeScript source through Vitest and
      # would not notice a dist/index.js that fails to load — which is the only form consumers run.
      #
      # The declared eligible branch is a sentinel that is never any pull request's base, so the
      # run settles at `eligibility.skipped.base_branch` before any credential or model call is
      # needed — deterministically, whatever the base. The previous value was `dev`, written when
      # every pull request here targeted `main`; after the dev/main topology (#41) that made this
      # assertion fail on every dev-based pull request and pass only on release pull requests.
      - name: Run the action against this pull request
        id: smoke
        # Only a pull_request event carries the payload this step asserts against. On a push to
        # main there is no pull request, and the action correctly fails closed — which is right
        # behaviour but a meaningless assertion here.
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          profile: examples/review-profile.json
          model_endpoint: https://example.invalid/v1
          model_id: unused-on-this-path
          model_protocol: anthropic
          model_token_env: SMOKE_UNUSED_TOKEN
          target_branches: smoke-eligibility-never

      # Three reasons are accepted because the runner owns this step's event payload, and the
      # eligibility ladder consults draftness, then fork ownership, then the base branch — so a
      # draft pull request settles at the draft rung, a fork pull request at the fork rung, and
      # only a same-repo, non-draft one ever reaches the sentinel base (the draft case failed for
      # real the day this repository opened its first draft pull request; the fork case is the
      # same class one rung later). All three prove the claim this step actually makes — the
      # bundle executed and settled at ELIGIBILITY, before any credential or model call. The exact
      # base-branch rung is pinned deterministically below, where the payload is constructed
      # rather than inherited.
      - name: Assert it settled at eligibility with a reason
        if: github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.smoke.outputs.outcome }}
          REASON: ${{ steps.smoke.outputs.reason }}
        run: |
          echo "outcome=${OUTCOME} reason=${REASON}"
          test "${OUTCOME}" = "skipped"
          case "${REASON}" in
            eligibility.skipped.base_branch|eligibility.skipped.draft|eligibility.skipped.fork) ;;
            *) echo "::error::settled outside the eligibility family: ${REASON}"; exit 1 ;;
          esac

      # The runner owns GITHUB_EVENT_PATH and ignores a step-level override, so the eligibility
      # matrix is driven by invoking the bundle directly. Same artifact, controlled payload.
      - name: Assert a fork head is refused
        env:
          INPUT_PROFILE: examples/review-profile.json
          INPUT_MODEL_ENDPOINT: https://example.invalid/v1
          INPUT_MODEL_ID: unused-on-this-path
          INPUT_MODEL_PROTOCOL: anthropic
          INPUT_MODEL_TOKEN_ENV: SMOKE_UNUSED_TOKEN
          INPUT_TARGET_BRANCHES: dev
        run: |
          cat > "${RUNNER_TEMP}/fork-event.json" <<'JSON'
          {
            "action": "synchronize",
            "pull_request": {
              "number": 1,
              "draft": false,
              "head": {
                "sha": "1111111111111111111111111111111111111111",
                "repo": { "full_name": "attacker/Keiko-for-Quality" }
              },
              "base": {
                "sha": "2222222222222222222222222222222222222222",
                "ref": "dev",
                "repo": { "full_name": "oscharko-dev/Keiko-for-Quality" }
              }
            }
          }
          JSON
          GITHUB_EVENT_PATH="${RUNNER_TEMP}/fork-event.json" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/fork-output.txt" \
            node dist/index.js
          cat "${RUNNER_TEMP}/fork-output.txt"
          grep -qx 'outcome=skipped' "${RUNNER_TEMP}/fork-output.txt"
          grep -qx 'reason=eligibility.skipped.fork' "${RUNNER_TEMP}/fork-output.txt"

      # The exact base-branch rung, pinned against a CONSTRUCTED payload: the `uses:` smoke above
      # inherits the runner's own event, so its rung depends on the live pull request's draftness —
      # this invocation controls every field, so the sentinel base is the one and only reason the
      # run can settle on.
      - name: Assert the base-branch rung against a controlled payload
        env:
          INPUT_PROFILE: examples/review-profile.json
          INPUT_MODEL_ENDPOINT: https://example.invalid/v1
          INPUT_MODEL_ID: unused-on-this-path
          INPUT_MODEL_PROTOCOL: anthropic
          INPUT_MODEL_TOKEN_ENV: SMOKE_UNUSED_TOKEN
          INPUT_TARGET_BRANCHES: smoke-eligibility-never
        run: |
          cat > "${RUNNER_TEMP}/base-branch-event.json" <<'JSON'
          {
            "action": "synchronize",
            "pull_request": {
              "number": 3,
              "draft": false,
              "head": {
                "sha": "5555555555555555555555555555555555555555",
                "repo": { "full_name": "oscharko-dev/Keiko-for-Quality" }
              },
              "base": {
                "sha": "6666666666666666666666666666666666666666",
                "ref": "dev",
                "repo": { "full_name": "oscharko-dev/Keiko-for-Quality" }
              }
            }
          }
          JSON
          GITHUB_EVENT_PATH="${RUNNER_TEMP}/base-branch-event.json" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/base-branch-output.txt" \
            node dist/index.js
          cat "${RUNNER_TEMP}/base-branch-output.txt"
          grep -Fqx 'outcome=skipped' "${RUNNER_TEMP}/base-branch-output.txt"
          grep -Fqx 'reason=eligibility.skipped.base_branch' "${RUNNER_TEMP}/base-branch-output.txt"

      # The redaction contract is a claim about what reaches a log. Assert it on real output.
      - name: Assert diagnostics carry no free-form text
        run: |
          cat > "${RUNNER_TEMP}/draft-event.json" <<'JSON'
          {
            "action": "opened",
            "pull_request": {
              "number": 2,
              "draft": true,
              "head": {
                "sha": "3333333333333333333333333333333333333333",
                "repo": { "full_name": "oscharko-dev/Keiko-for-Quality" }
              },
              "base": {
                "sha": "4444444444444444444444444444444444444444",
                "ref": "dev",
                "repo": { "full_name": "oscharko-dev/Keiko-for-Quality" }
              }
            }
          }
          JSON
          GITHUB_EVENT_PATH="${RUNNER_TEMP}/draft-event.json" \
            node dist/index.js > "${RUNNER_TEMP}/diagnostics.txt"
          cat "${RUNNER_TEMP}/diagnostics.txt"
          node scripts/assert-diagnostic-vocabulary.mjs "${RUNNER_TEMP}/diagnostics.txt"

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The token lives in this environment rather than at repository scope, so only a job that
    # declares it can read it — same pattern as the qualification workflow's model credential.
    environment: sonarcloud
    # Forked pull requests receive no secrets, so the scanner cannot authenticate from them. They
    # deliberately remain blocked by the protected aggregate until their change is carried by a
    # trusted same-repository branch. Release-line pushes do not rescan the byte-identical dev tree;
    # the separate provenance job below proves that identity before the aggregate can pass.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the SCM sensor attributes changed lines by blame, and a shallow clone
          # would mark every line new on every analysis.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test with coverage
        run: npm run test:coverage

      - name: Read the project version
        id: sonar-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Downloaded and checksum-verified directly rather than through a marketplace action —
      # the same digest-pinned archive the Keiko consumer verifies (scanner 8.1.0.6389).
      - name: Download Sonar Scanner CLI
        run: |
          set -euo pipefail
          scanner_zip="$RUNNER_TEMP/sonar-scanner-cli.zip"
          curl --proto '=https' -sSfL -o "$scanner_zip" "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip"
          echo "bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b  $scanner_zip" | sha256sum --check
          unzip -q "$scanner_zip" -d "$RUNNER_TEMP"
          echo "SONAR_SCANNER_HOME=$RUNNER_TEMP/sonar-scanner-8.1.0.6389-linux-x64" >> "$GITHUB_ENV"

      - name: SonarCloud CI-based analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_VERSION: ${{ steps.sonar-version.outputs.version }}
          # Pull-request runs analyze the merge ref, whose SHA differs from the head; pin the
          # analysis revision so changed lines attribute to the real head commit.
          SONAR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          "$SONAR_SCANNER_HOME/bin/sonar-scanner" \
            -Dsonar.projectBaseDir="$GITHUB_WORKSPACE" \
            -Dsonar.projectVersion="$SONAR_VERSION" \
            -Dsonar.scm.revision="$SONAR_HEAD_SHA" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.working.directory="$RUNNER_TEMP/sonar-work"

      # The active Free-plan gate is Sonar way, just as on Keiko. It cannot express the stricter
      # repository contract, so the exact Keiko Banking Grade definition and its evidence are
      # checked after the scanner has completed. This step also rejects every unresolved PR issue.
      - name: Verify Keiko Banking Grade pull-request evidence
        if: github.event_name == 'pull_request'
        env:
          SONAR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SONAR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/check-sonar-pr-quality-gate.mjs

      # KfQ intentionally goes beyond Keiko's legacy-debt allowance: a dev analysis is green only
      # when ALL unresolved issues are zero, not merely issues inside the current leak period.
      - name: Verify zero-open-issue dev evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          SONAR_BASE_SHA: ${{ github.event.before }}
          SONAR_HEAD_SHA: ${{ github.sha }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/check-sonar-main-quality-gate.mjs

  main_provenance:
    name: main provenance
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # A pull-request checkout normally selects GitHub's synthetic merge commit. Provenance
          # belongs to the release branch's signed HEAD; the main-push path uses github.sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # GitHub's job token cannot read the repository-admin squash-message setting. The platform
      # rule is stronger: GitHub rejects the main update itself unless the generated commit keeps
      # all three provenance trailers. This public read proves that rule before merge and again on
      # the resulting main revision.
      - name: Require the platform release-trailer rule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/rulesets" --paginate \
              --jq '.[] | select(.name == "main release provenance trailers") | .id'
          )
          if [ "${#ids[@]}" -ne 1 ]; then
            echo "expected exactly one main release provenance trailer ruleset"
            exit 1
          fi
          valid=$(
            gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ids[0]}" --jq '
              .target == "branch" and
              .enforcement == "active" and
              (.bypass_actors | length) == 0 and
              .conditions.ref_name.include == ["refs/heads/main"] and
              .conditions.ref_name.exclude == [] and
              (.rules | length) == 1 and
              .rules[0].type == "commit_message_pattern" and
              .rules[0].parameters.operator == "regex" and
              .rules[0].parameters.negate == false and
              .rules[0].parameters.pattern ==
                "Keiko-Release-Dev-Commit: [0-9a-f]{40}[\\s\\S]*Keiko-Release-Dev-Tree: [0-9a-f]{40}[\\s\\S]*Keiko-Release-Channel: (standard|recovery)"
            '
          )
          if [ "$valid" != "true" ]; then
            echo "main release provenance trailer ruleset is missing or weakened"
            exit 1
          fi

      # main is a release ledger, not a second integration line. The pre-merge run makes the
      # binding load-bearing while the PR is still reversible; the push run proves the squash
      # preserved it before reusing dev's Sonar evidence. The release commit binds the exact dev
      # commit and tree it copied, so a later dev push cannot invalidate either proof.
      - name: Prove the release tree is the bound governed dev tree
        run: node scripts/release-main-provenance.mjs

  # Branch protection already requires the `verify` context. Keep that stable while making the
  # post-scan evidence load-bearing: ordinary work cannot pass when either core verification or
  # Sonar fails. A main push is the single skipped-Sonar path, and passes only when main_provenance
  # proves its tree is exactly the already-governed dev tree.
  verify:
    name: verify
    if: ${{ always() }}
    needs: [core_verify, main_provenance, sonar]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Aggregate core and Sonar evidence fail closed
        env:
          CORE_RESULT: ${{ needs.core_verify.result }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          MAIN_PROVENANCE_RESULT: ${{ needs.main_provenance.result }}
          REF: ${{ github.ref }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          set -euo pipefail
          if [ "$CORE_RESULT" != "success" ]; then
            echo "Core verification did not succeed: $CORE_RESULT"
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            if [ "$SONAR_RESULT" != "skipped" ]; then
              echo "main must reuse governed dev evidence instead of starting a second scan: $SONAR_RESULT"
              exit 1
            fi
            if [ "$MAIN_PROVENANCE_RESULT" != "success" ]; then
              echo "main provenance did not succeed: $MAIN_PROVENANCE_RESULT"
              exit 1
            fi
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            if [ "$MAIN_PROVENANCE_RESULT" != "success" ]; then
              echo "release provenance did not succeed before the main merge: $MAIN_PROVENANCE_RESULT"
              exit 1
            fi
          else
            if [ "$MAIN_PROVENANCE_RESULT" != "skipped" ]; then
              echo "main provenance ran outside a release PR or main push: $MAIN_PROVENANCE_RESULT"
              exit 1
            fi
          fi
          if [ "$SONAR_RESULT" = "success" ]; then
            exit 0
          fi
          echo "Sonar verification did not succeed: $SONAR_RESULT"
          exit 1
