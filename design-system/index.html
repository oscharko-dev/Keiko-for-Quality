>\n              <a href=\"#email\" style=\"display:inline-block;color:#37795B;font-size:13px;font-weight:600;padding:10px 14px;text-decoration:none\">Configure profile<\u002Fa>\n            <\u002Fdiv>\n            <div style=\"padding:14px 24px 18px;border-top:1px solid #ECEFEC\">\n              <div style=\"font-size:11.5px;color:#8A938D;line-height:1.6\">Sent once, to the installer. Nothing leaves your repositories except review comments. <a href=\"#email\" style=\"color:#37795B\">Security policy<\u002Fa><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n    <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;box-shadow:var(--shadow-card);margin-top:24px\">\n      <div style=\"font-size:13px;font-weight:600;margin-bottom:10px\">Email engineering spec<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 24px;font-size:12.5px;color:var(--fg-muted);line-height:1.8\">\n        <div>Canvas 600 px, content 552 px, MSO tables<\u002Fdiv>\n        <div>Fonts: <code style=\"font-family:var(--font-mono);font-size:11px\">-apple-system, Segoe UI, sans-serif<\u002Fcode>; numerals/code <code style=\"font-family:var(--font-mono);font-size:11px\">Menlo, Consolas, monospace<\u002Fcode><\u002Fdiv>\n        <div>Glyphs as inline PNG 2× (36 px source for 18 px)<\u002Fdiv>\n        <div>Two headers: ink <code style=\"font-family:var(--font-mono);font-size:11px\">#212623<\u002Fcode> for runtime mail · brand green <code style=\"font-family:var(--font-mono);font-size:11px\">#4EBA87<\u002Fcode> with the negative ink orca for announcements — the orca reads on either<\u002Fdiv>\n        <div>CTA <code style=\"font-family:var(--font-mono);font-size:11px\">#2E8C63<\u002Fcode>, white label, radius 9 — one primary CTA per mail<\u002Fdiv>\n        <div>Links <code style=\"font-family:var(--font-mono);font-size:11px\">#37795B<\u002Fcode>; text floor 12 px; footer 11.5 px<\u002Fdiv>\n        <div>Severity tints: 12% mixes of the status hues (see chips above) with AA text tones<\u002Fdiv>\n        <div>Dark-mode meta tags omitted deliberately — the light body is the designed rendering<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"cli\" data-screen-label=\"CLI\" style=\"border-bottom:1px solid var(--line-soft)\">\n  <div style=\"max-width:1080px;margin:0 auto;padding:72px 32px\">\n    <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px\">07 · CLI<\u002Fdiv>\n    <h2 style=\"font-size:var(--text-title-lg);font-weight:650;letter-spacing:-0.015em;margin:0 0 12px\">The run, in 80 columns<\u002Fh2>\n    <p style=\"max-width:640px;color:var(--fg-muted);line-height:1.65;margin:0 0 28px\">\n      <code style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg-dim)\">keiko-quality<\u002Fcode> speaks the same vocabulary in ANSI: severity as fixed four-character tags, counts\n      right-aligned, one indent level of two spaces. No spinners, no boxes drawn in Unicode, no colour\n      except the five semantic ones.\n    <\u002Fp>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start\">\n      <div style=\"background:#141816;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-card)\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line-soft)\">\n          <span style=\"width:10px;height:10px;border-radius:50%;border:1px solid var(--line-strong)\"><\u002Fspan>\n          <span style=\"width:10px;height:10px;border-radius:50%;border:1px solid var(--line-strong)\"><\u002Fspan>\n          <span style=\"width:10px;height:10px;border-radius:50%;border:1px solid var(--line-strong)\"><\u002Fspan>\n ept findings and outcome<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"ide\" data-screen-label=\"IDE plugins\" style=\"border-bottom:1px solid var(--line-soft)\">\n  <div style=\"max-width:1080px;margin:0 auto;padding:72px 32px\">\n    <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px\">08 · IDE plugins<\u002Fdiv>\n    <h2 style=\"font-size:var(--text-title-lg);font-weight:650;letter-spacing:-0.015em;margin:0 0 12px\">Findings where the code is<\u002Fh2>\n    <p style=\"max-width:640px;color:var(--fg-muted);line-height:1.65;margin:0 0 32px\">\n      The JetBrains and VS Code plugins bring the same findings into the editor — same vocabulary, same\n      glyphs, same honesty rules. The plugin is a guest: it uses the IDE's own fonts, densities and theme\n      engine, and adds only the Lift glyphs, the severity colours and the classification line. Nothing is\n      restyled that the host already styles.\n    <\u002Fp>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-bottom:24px\">\n\n      <div data-screen-label=\"IDE: JetBrains\">\n        <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-dim);margin-bottom:10px\">① JetBrains · IntelliJ — tool window + gutter<\u002Fdiv>\n        <div style=\"background:#141816;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-card)\">\n          <div style=\"padding:10px 14px;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);font-size:11px;line-height:2;color:var(--fg-muted)\">\n            <div style=\"display:flex;gap:12px;min-width:0\"><span style=\"color:var(--fg-faint);width:44px;text-align:right;flex:none\">53<\u002Fspan><span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">const activation = await activate(<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;min-width:0;background:color-mix(in oklch, var(--warn) 8%, transparent);border-radius:4px\"><span style=\"color:var(--fg-faint);width:44px;text-align:right;flex:none;display:inline-flex;justify-content:flex-end;align-items:center;gap:6px\"><span data-qicon=\"sevMajor\" data-size=\"12\" style=\"color:var(--warn);display:inline-flex\"><\u002Fspan>54<\u002Fspan><span style=\"white-space:nowrap;overflow:hidden;flex:none;border-bottom:1.5px dotted var(--warn)\">carriesReleaseSignature: (root) =&gt; {<\u002Fspan><span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-faint);font-size:10px;margin-left:auto;padding-left:12px\">Keiko: add verifyImmutableOwnership<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;min-width:0\"><span style=\"color:var(--fg-faint);width:44px;text-align:right;flex:none\">55<\u002Fspan><span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">  probed.push([root, target]);<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line-soft)\">\n            <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--fg);white-space:nowrap\"><span style=\"width:15px;height:15px;border-radius:4px;background:#4EBA87;position:relative;display:inline-block\"><img src=\"e651ecb6-1bb2-4abc-9e49-870bd36c7320\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:1.5px;box-sizing:border-box\"><\u002Fspan>Keiko for Quality<\u002Fspan>\n            <span style=\"font-size:11.5px;color:var(--fg-dim);white-space:nowrap\">Run: <span style=\"color:var(--ok)\">complete<\u002Fspan> · head ccc097d<\u002Fspan>\n            <span style=\"margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);white-space
