# SonarCloud CI-based analysis, mirroring the Keiko consumer's model: the scanner runs in CI
# against the exact checkout, Automatic Analysis is disabled on the SonarCloud project, and the
# quality gate is waited on so a red gate is a red check — never a decoration that arrives late.
#
# sonar.projectVersion is intentionally NOT set here — the CI step passes it from package.json,
# so the New Code Definition (previous_version) has a real value on every analysis.
sonar.projectKey=oscharko-dev_Keiko-for-Quality
sonar.organization=oscharko-dev
sonar.projectName=Keiko for Quality
sonar.sourceEncoding=UTF-8

sonar.typescript.tsconfigPaths=tsconfig.json

# Sources and tests are explicit and disjoint: test.inclusions removes the matching paths from
# main-code scope, and the exclusions pin that split across scanner upgrades. corpus/ and scripts/
# are product code here — plain Node ESM outside the TypeScript program, but reviewable source.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs
sonar.exclusions=**/dist/**,**/build/**,**/coverage/**,**/node_modules/**,**/*.test.ts,**/*.test.mjs

# dist/index.js is a committed build artifact (consumers execute it; check:bundle proves it matches
# the source byte-for-byte), so analyzing it would double every finding in bundled form.
# It is caught by the dist/** exclusion above; this comment records that the exclusion is a
# deliberate decision about a tracked file, not housekeeping.

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions are narrower than the analysis scope on purpose: everything below stays
# fully analyzed (issues, hotspots, duplication) but is exempt from the new-code coverage ratio.
# scripts/ and the corpus DRIVERS are operator tooling whose top-level flows run only as
# subprocesses — node --test coverage cannot see a child process, so a coverage requirement there
# manufactures wrapper tests with no assertion value. Their behaviour is pinned end-to-end by the
# subprocess startup tests in src/engine/corpus-harness.test.ts (usage exits, loader-path
# generation, settlement). The corpus LIBRARIES that carry real logic — arena-lib.mjs,
# arena-fetch.mjs, rule-source.mjs — are deliberately NOT excluded and keep their in-process
# coverage duty.
sonar.coverage.exclusions=scripts/**,corpus/run.mjs,corpus/real-diffs.mjs,corpus/binding.mjs,corpus/cases.mjs,corpus/fixed-path.mjs,corpus/fixtures/**,corpus/arena.mjs

# No PL/SQL sources exist here. Clearing the suffixes stops the bundled PLSQL analyzer from
# emitting its rules-disabled warning on every run — same reasoning as the Keiko consumer.
sonar.plsql.file.suffixes=-
