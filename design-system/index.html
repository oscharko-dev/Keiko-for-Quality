 160);\n  --grid-dot: oklch(0.78 0.012 160);\n  --fg: oklch(0.26 0.012 160);\n  --fg-muted: oklch(0.42 0.011 160);\n  --fg-dim: oklch(0.48 0.01 160);\n  --fg-faint: oklch(0.52 0.01 160);\n  --accent-text: oklch(0.48 0.13 160);\n  --accent-solid: oklch(0.52 0.15 160);  /* darker green: 4.96:1 vs white, room for a white mark */\n  --accent-solid-ink: oklch(1 0 0);\n  --accent-on-tint: oklch(0.43 0.13 160); /* 6.3:1 on the pale accent tint */\n  --ink-inverse: oklch(0.18 0.005 160);\n  --accent-bright: oklch(0.52 0.13 160);\n  --danger: oklch(0.5 0.18 25);\n  --warn: oklch(0.43 0.14 75);\n  --info: oklch(0.45 0.15 240);\n  --ok: oklch(0.5 0.13 146);\n  --shadow-card: 0 1px 0 0 oklch(1 0 0 / 0.7) inset, 0 6px 18px -12px rgba(20, 30, 25, 0.22);\n  --shadow-pop: 0 18px 50px -18px rgba(20, 30, 25, 0.26), 0 0 0 1px var(--line);\n}\n\n/* ===== a11y base ===== */\n:focus-visible {\n  outline: var(--focus-w, 2px) solid transparent; /* surfaces the ring in forced-colors / Windows High Contrast */\n  outline-offset: 2px;\n  border-radius: 3px;\n  /* two-tone ring: a neutral separator hugging the control + the accent ring outside it. */\n  box-shadow: 0 0 0 2px var(--bg), 0 0 0 calc(var(--focus-w, 2px) + 2px) var(--accent-text);\n}\n.skip-link {\n  position: fixed; top: 10px; left: 10px; z-index: 200;\n  padding: 10px 15px; background: var(--card); color: var(--fg);\n  border: 1px solid var(--accent-line); border-radius: var(--radius-sm);\n  font-family: var(--font-ui); font-size: 13px; text-decoration: none;\n  transform: translateY(-180%); transition: transform 0.15s;\n}\n.skip-link:focus { transform: none; }\n\n/* ============================================================\n   HIGH CONTRAST — a first-class, selectable third mode.\n   Single-source HC palettes — the raw values live here exactly once.\n   ============================================================ */\n:root {\n  /* HC · DARK palette */\n  --hc-d-bg: oklch(0.11 0.004 160);\n  --hc-d-surface: oklch(0.145 0.004 160);\n  --hc-d-card: oklch(0.185 0.004 160);\n  --hc-d-card-2: oklch(0.225 0.004 160);\n  --hc-d-inset: oklch(0.09 0.004 160);\n  --hc-d-line: oklch(0.62 0.006 160);\n  --hc-d-line-soft: oklch(0.5 0.005 160);\n  --hc-d-line-strong: oklch(0.74 0.006 160);\n  --hc-d-grid-dot: oklch(0.52 0.006 160);\n  --hc-d-fg: oklch(1 0 0);\n  --hc-d-fg-muted: oklch(0.88 0.004 160);\n  --hc-d-fg-dim: oklch(0.84 0.004 160);\n  --hc-d-fg-faint: oklch(0.82 0.004 160);\n  --hc-d-accent-bright: oklch(0.88 0.15 160);\n  --hc-d-accent-text: oklch(0.86 0.16 160);\n  --hc-d-accent-dim: color-mix(in oklch, var(--accent) 28%, transparent);\n  --hc-d-accent-line: color-mix(in oklch, var(--accent) 72%, transparent);\n  --hc-d-accent-glow: color-mix(in oklch, var(--accent) 42%, transparent);\n  --hc-d-warn: oklch(0.88 0.14 80);\n  --hc-d-danger: oklch(0.78 0.17 25);\n  --hc-d-ok: oklch(0.82 0.15 146);\n  --hc-d-info: oklch(0.84 0.12 240);\n  --hc-d-shadow-card: 0 0 0 1px var(--hc-d-line), 0 8px 24px -12px rgba(0, 0, 0, 0.7);\n  --hc-d-shadow-pop: 0 0 0 1px var(--hc-d-line-strong), 0 18px 50px -18px rgba(0, 0, 0, 0.85);\n\n  /* HC · LIGHT palette */\n  --hc-l-bg: oklch(1 0 0);\n  --hc-l-surface: oklch(0.99 0.002 160);\n  --hc-l-card: oklch(1 0 0);\n  --hc-l-card-2: oklch(0.965 0.004 160);\n  --hc-l-inset: oklch(0.95 0.004 160);\n  --hc-l-line: oklch(0.45 0.008 160);\n  --hc-l-line-soft: oklch(0.6 0.006 160);\n  --hc-l-line-strong: oklch(0.35 0.01 160);\n  --hc-l-grid-dot: oklch(0.6 0.01 160);\n  --hc-l-fg: oklch(0.13 0.01 160);\n  --hc-l-fg-muted: oklch(0.3 0.012 160);\n  --hc-l-fg-dim: oklch(0.34 0.012 160);\n  --hc-l-fg-faint: oklch(0.36 0.012 160);\n  --hc-l-accent-text: oklch(0.42 0.14 160);\n  --hc-l-accent-bright: oklch(0.42 0.14 160);\n  --hc-l-accent-dim: color-mix(in oklch, var(--accent) 22%, transparent);\n  --hc-l-accent-line: color-mix(in oklch, var(--hc-l-accent-text) 78%, transparent);\n  --hc-l-accent-glow: color-mix(in oklch, var(--hc-l-accent-text) 32%, transparent);\n  --hc-l-danger: oklch(0.42 0.19 25);\n  --hc-l-warn: oklch(0.38 0.14 75);\n  --hc-l-info: oklch(0.4 0.16 240);\n  --hc-l-ok: oklch(0.4 0.14 146);\n  --hc-l-shadow-card: 0 0 0 1px var(--hc-l-line-strong);\n  --hc-l-shadow-pop: 0 18px 50px -18px rgba(20, 30, 25, 0.32), 0 0 0 1px var(--hc-l-line-strong);\n}\n\n@media (prefers-contrast: more) {\n  :root {\n    color-scheme: dark;\n    --bg: var(--hc-d-bg); --surface: var(--hc-d-surface); --card: var(--hc-d-card); --card-2: var(--hc-d-card-2); --inset: var(--hc-d-inset);\n    --line: var(--hc-d-line); --line-soft: var(--hc-d-line-soft); --line-strong: var(--hc-d-line-strong); --grid-dot: var(--hc-d-grid-dot);\n    --focus-w: 3px;\n    --fg: var(--hc-d-fg); --fg-muted: var(--hc-d-fg-muted); --fg-dim: var(--hc-d-fg-dim); --fg-faint: var(--hc-d-fg-faint);\n    --accent-bright: var(--hc-d-accent-bright); --accent-text: var(--hc-d-accent-text);\n    --accent-dim: var(--hc-d-accent-dim); --accent-line: var(--hc-d-accent-line); --accent-glow: var(--hc-d-accent-glow);\n    --warn: var(--hc-d-warn); --danger: var(--hc-d-danger); --ok: var(--hc-d-ok); --info: var(--hc-d-info);\n    --shadow-card: var(--hc-d-shadow-card); --shadow-pop: var(--hc-d-shadow-pop);\n  }\n  [data-theme=\"light\"] {\n    color-scheme: light;\n    --bg: var(--hc-l-bg); --surface: var(--hc-l-surface); --card: var(--hc-l-card); --card-2: var(--hc-l-card-2); --inset: var(--hc-l-inset);\n    --line: var(--hc-l-line); --line-soft: var(--hc-l-line-soft); --line-strong: var(--hc-l-line-strong); --grid-dot: var(--hc-l-grid-dot);\n    --focus-w: 3px;\n    --fg: var(--hc-l-fg); --fg-muted: var(--hc-l-fg-muted); --fg-dim: var(--hc-l-fg-dim); --fg-faint: var(--hc-l-fg-faint);\n    --accent-text: var(--hc-l-accent-text); --accent-bright: var(--hc-l-accent-bright);\n    --accent-dim: var(--hc-l-accent-dim); --accent-line: var(--hc-l-accent-line); --accent-glow: var(--hc-l-accent-glow);\n    --danger: var(--hc-l-danger); --warn: var(--hc-l-warn); --info: var(--hc-l-info); --ok: var(--hc-l-ok);\n    --shadow-card: var(--hc-l-shadow-card); --shadow-pop: var(--hc-l-shadow-pop);\n  }\n}\n\n/* explicit in-app override — identical palettes, higher specificity. */\n[data-hc=\"more\"] {\n  color-scheme: dark;\n  --bg: var(--hc-d-bg); --surface: var(--hc-d-surface); --card: var(--hc-d-card); --card-2: var(--hc-d-card-2); --inset: var(--hc-d-inset);\n  --line: var(--hc-d-line); --line-soft: var(--hc-d-line-soft); --line-strong: var(--hc-d-line-strong); --grid-dot: var(--hc-d-grid-dot);\n  --focus-w: 3px;\n  --fg: var(--hc-d-fg); --fg-muted: var(--hc-d-fg-muted); --fg-dim: var(--hc-d-fg-dim); --fg-faint: var(--hc-d-fg-faint);\n  --accent-bright: var(--hc-d-accent-bright); --accent-text: var(--hc-d-accent-text);\n  --accent-dim: var(--hc-d-accent-dim); --accent-line: var(--hc-d-accent-line); --accent-glow: var(--hc-d-accent-glow);\n  --warn: var(--hc-d-warn); --danger: var(--hc-d-danger); --ok: var(--hc-d-ok); --info: var(--hc-d-info);\n  --shadow-card: var(--hc-d-shadow-card); --shadow-pop: var(--hc-d-shadow-pop);\n}\n[data-hc=\"more\"][data-theme=\"light\"] {\n  color-scheme: light;\n  --bg: var(--hc-l-bg); --surface: var(--hc-l-surface); --card: var(--hc-l-card); --card-2: var(--hc-l-card-2); --inset: var(--hc-l-inset);\n  --line: var(--hc-l-line); --line-soft: var(--hc-l-line-soft); --line-strong: var(--hc-l-line-strong); --grid-dot: var(--hc-l-grid-dot);\n  --focus-w: 3px;\n  --fg: var(--hc-l-fg); --fg-muted: var(--hc-l-fg-muted); --fg-dim: var(--hc-l-fg-dim); --fg-faint: var(--hc-l-fg-faint);\n  --accent-text: var(--hc-l-accent-text); --accent-bright: var(--hc-l-accent-bright);\n  --accent-dim: var(--hc-l-accent-dim); --accent-line: var(--hc-l-accent-line); --accent-glow: var(--hc-l-accent-glow);\n  --danger: var(--hc-l-danger); --warn: var(--hc-l-warn); --info: var(--hc-l-info); --ok: var(--hc-l-ok);\n  --shadow-card: var(--hc-l-shadow-card); --shadow-pop: var(--hc-l-shadow-pop);\n}\n\n/* Windows / forced-colors High Contrast */\n@media (forced-colors: active) {\n  :focus-visible { outline: 3px solid Highlight; outline-offset: 2px; box-shadow: none; }\n  .kx-win, .card { border: 1px solid CanvasText; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.001ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n\n/* ============================================================\n   semantic.css — the middle + top of Keiko's three-tier token\n   architecture.\n     1. PRIMITIVES   primitives.css   (raw oklch, shadows, radius)\n     2. SCALES       this file        (space · motion · z · opacity · blur · weight · leading)\n     3. SEMANTIC     this file        (background.* · text.* · action.* · feedback.* · focus …)\n     4. COMPONENT    this file        (button.* · input.* · card.* · ai.* · table.* · nav.*)\n   Every semantic + component token RESOLVES to a primitive. Because the\n   primitives already redefine themselves for light / HC / forced-colors,\n   these aliases inherit all modes automatically.\n   Load AFTER primitives.css, BEFORE the component class files.\n   ============================================================ */\n\n:root {\n  /* ───────────── SCALE · SPACING — 2-based rhythm ───────────── */\n  --space-0: 0;\n  --space-1: 2px;   /* hairline insets */\n  --space-2: 4px;   /* icon-to-icon in a cluster */\n  --space-3: 6px;   /* chip / small-button padding */\n  --space-4: 8px;   /* default gap between related elements */\n  --space-5: 12px;  /* list-row padding, menu items */\n  --space-6: 14px;  /* card inner padding, composer */\n  --space-7: 18px;  /* gap between cards */\n  --space-8: 24px;  /* dot-grid pitch · block spacing */\n  --space-9: 32px;  /* sub-section separation */\n  --space-10: 48px; /* section separation */\n  --space-12: 64px;\n  --space-16: 96px;\n\n  /* ───────────── SCALE · RADIUS (alias) ───────────── */\n  --radius-pill: 999px;\n  --radius-control: var(--radius-sm);  /* chips, inputs, buttons, menu items */\n  --radius-surface: var(--radius);     /* cards, windows, panels, popovers */\n  --radius-floating: var(--radius-lg); /* composer, sheets */\n\n  /* ───────────── SCALE · TYPE WEIGHT ───────────── */\n  --weight-regular: 400; /* @kind font */\n  --weight-medium: 500; /* @kind font */\n  --weight-semibold: 600; /* @kind font */\n  --weight-strong: 650; /* @kind font */ /* the brand/title weight used in chrome */\n\n  /* ───────────── SCALE · LINE-HEIGHT ───────────── */\n  --leading-tight: 1.1; /* @kind font */\n  --leading-snug: 1.3; /* @kind font */\n  --leading-normal: 1.5; /* @kind font */\n  --leading-relaxed: 1.65; /* @kind font */\n\n  /* ───────────── SCALE · TYPE SIZE — 11px floor ───────────── */\n  --text-caption: 11px;\n  --text-label: 12px;\n  --text-body-sm: 13px;\n  --text-body: 14px;\n  --text-body-lg: 15px;\n  --text-heading: 17px;\n  --text-title: 22px;\n  --text-title-lg: 28px;\n  --text-display-sm: 36px;\n  --text-display: 50px;\n\n  /* ───────────── SCALE · OPACITY ───────────── */\n  --opacity-disabled: 0.42; /* @kind other */\n  --opacity-muted: 0.64; /* @kind other */\n  --opacity-hover-veil: 0.06; /* @kind other */\n  --opacity-scrim: 0.55; /* @kind other */\n  --opacity-scrim-strong: 0.72; /* @kind other */\n\n  /* ───────────── SCALE · BLUR ───────────── */\n  --blur-sm: 4px;\n  --blur-md: 12px;\n  --blur-lg: 28px;\n\n  /* ───────────── SCALE · MOTION ───────────── */\n  --dur-instant: 80ms; /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 180ms; /* @kind other */\n  --dur-slow: 260ms; /* @kind other */\n  --dur-flow: 1100ms; /* @kind other */\n\n  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-in: cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n\n  /* ───────────── SCALE · Z-INDEX — named layers ───────────── */\n  --z-base: 0; /* @kind other */\n  --z-canvas-window: 10; /* @kind other */\n  --z-canvas-window-active: 20; /* @kind other */\n  --z-rail: 40; /* @kind other */\n  --z-nav: 50; /* @kind other */\n  --z-sticky: 80; /* @kind other */\n  --z-dropdown: 100; /* @kind other */\n  --z-overlay: 200; /* @kind other */\n  --z-modal: 300; /* @kind other */\n  --z-popover: 400; /* @kind other */\n  --z-toast: 500; /* @kind other */\n  --z-tooltip: 600; /* @kind other */\n\n  /* ───────────── SCALE · BREAKPOINTS ───────────── */\n  --bp-xs: 480px;\n  --bp-sm: 640px;\n  --bp-md: 768px;\n  --bp-lg: 900px;\n  --bp-xl: 1200px;\n  --bp-2xl: 1536px;\n\n  /* ───────────── SCALE · DENSITY ───────────── */\n  --control-height: 34px;\n  --control-height-sm: 28px;\n  --control-height-lg: 40px;\n  --control-pad-x: 14px;\n  --row-pad-y: 9px;\n  --row-pad-x: 12px;\n\n  /* ════════════ SEMANTIC TOKENS ════════════ */\n\n  /* background — the room the app sits in */\n  --background-primary: var(--bg);\n  --background-secondary: var(--surface);\n\n  /* surface — raised material */\n  --surface-primary: var(--card);\n  --surface-secondary: var(--card-2);\n  --surface-elevated: var(--card-2);\n  --surface-inset: var(--inset);\n  --surface-overlay: var(--surface);\n  --surface-accent-subtle: var(--accent-dim);\n  --surface-accent-glow: var(--accent-glow);\n\n  /* text */\n  --text-primary: var(--fg);\n  --text-secondary: var(--fg-muted);\n  --text-tertiary: var(--fg-dim);\n  --text-faint: var(--fg-faint);\n  --text-disabled: var(--fg-faint);\n  --text-inverse: var(--ink-inverse);\n  --text-accent: var(--accent-text);\n  --text-on-accent: var(--ink-inverse);\n\n  /* border */\n  --border-subtle: var(--line-soft);\n  --border-default: var(--line);\n  --border-strong: var(--line-strong);\n  --border-accent: var(--accent-line);\n\n  /* action — interactive intent */\n  --action-primary: var(--accent);\n  --action-primary-text: var(--accent-text);\n  --action-secondary-surface: var(--card);\n  --action-secondary-border: var(--line);\n  --action-tertiary-text: var(--fg-muted);\n\n  /* feedback — status, always paired with icon + word */\n  --feedback-success: var(--ok);\n  --feedback-warning: var(--warn);\n  --feedback-danger: var(--danger);\n  --feedback-info: var(--info);\n  --feedback-success-surface: color-mix(in oklch, var(--ok) 12%, transparent);\n  --feedback-warning-surface: color-mix(in oklch, var(--warn) 12%, transparent);\n  --feedback-danger-surface: color-mix(in oklch, var(--danger) 12%, transparent);\n  --feedback-info-surface: color-mix(in oklch, var(--info) 12%, transparent);\n\n  /* focus / selection */\n  --focus-ring: var(--accent-text);\n  --focus-width: var(--focus-w);\n  --selection-surface: var(--accent-glow);\n\n  /* overlays */\n  --overlay-scrim: oklch(0 0 0 / var(--opacity-scrim));\n  --overlay-scrim-strong: oklch(0 0 0 / var(--opacity-scrim-strong));\n\n  /* skeleton / loading */\n  --skeleton-base: var(--inset);\n  --skeleton-highlight: var(--card-2);\n\n  /* ════════════ COMPONENT TOKENS ════════════ */\n\n  /* Button · primary (the single green fill) */\n  --button-primary-surface: var(--accent);\n  --button-primary-surface-hover: var(--accent-bright);\n  --button-primary-text: var(--ink-inverse);\n  --button-primary-disabled-surface: var(--card-2);\n  --button-primary-disabled-text: var(--fg-faint);\n\n  /* Button · secondary (bordered) */\n  --button-secondary-surface: var(--card);\n  --button-secondary-surface-hover: var(--card-2);\n  --button-secondary-border: var(--line);\n  --button-secondary-text: var(--fg);\n\n  /* Button · ghost / destructive accents */\n  --button-ghost-surface-hover: var(--inset);\n  --button-danger-surface: var(--danger);\n  --button-danger-text: var(--ink-inverse);\n\n  /* Input / field */\n  --input-surface: var(--inset);\n  --input-border: var(--line);\n  --input-border-hover: var(--line-strong);\n  --input-border-focus: var(--accent-line);\n  --input-border-error: var(--danger);\n  --input-text: var(--fg);\n  --input-placeholder: var(--fg-muted);\n  --input-ring-focus: var(--accent-glow);\n\n  /* Card / window */\n  --card-surface: var(--card);\n  --card-border: var(--line);\n  --card-shadow: var(--shadow-card);\n  --card-shadow-raised: var(--shadow-pop);\n\n  /* Modal / sheet / drawer */\n  --modal-surface: var(--card);\n  --modal-border: var(--line);\n  --modal-backdrop: var(--overlay-scrim);\n  --modal-shadow: var(--shadow-pop);\n\n  /* Popover / tooltip / menu */\n  --popover-surface: var(--surface);\n  --popover-border: var(--line);\n  --popover-shadow: var(--shadow-pop);\n  --tooltip-surface: var(--card-2);\n  --tooltip-text: var(--fg);\n  --menu-item-surface-hover: var(--card);\n\n  /* Toast / banner */\n  --toast-surface: var(--card);\n  --toast-border: var(--line);\n  --toast-shadow: var(--shadow-pop);\n\n  /* AI / agent surfaces */\n  --ai-response-surface: var(--surface);\n  --ai-response-border: var(--line-soft);\n  --ai-thinking-indicator: var(--accent-text);\n  --ai-streaming-cursor: var(--accent);\n  --ai-source-border: var(--accent-line);\n  --ai-source-surface: var(--accent-dim);\n  --ai-tool-surface: var(--inset);\n  --ai-tool-border: var(--line);\n  --ai-confidence-high: var(--ok);\n  --ai-confidence-medium: var(--warn);\n  --ai-confidence-low: var(--danger);\n  --ai-permission-surface: var(--feedback-warning-surface);\n  --ai-permission-border: color-mix(in oklch, var(--warn) 40%, transparent);\n\n  /* Table / data */\n  --table-header-text: var(--fg-faint);\n  --table-header-surface: var(--card-2);\n  --table-row-border: var(--line-soft);\n  --table-row-surface-hover: var(--card);\n  --table-row-surface-selected: var(--accent-dim);\n  --table-foot-surface: var(--card-2);\n  --table-sort-indicator: var(--accent-text);\n  --table-num-text: var(--fg);\n\n  /* Navigation */\n  --nav-surface: var(--surface);\n  --nav-item-text: var(--fg-muted);\n  --nav-item-text-active: var(--fg);\n  --nav-item-surface-active: var(--card);\n  --nav-item-indicator: var(--accent-text);\n\n  /* Checkbox / radio */\n  --checkbox-surface: var(--inset);\n  --checkbox-border: var(--line);\n  --checkbox-surface-selected: var(--accent-solid);\n  --checkbox-mark: var(--accent-solid-ink);\n  --radio-surface: var(--inset);\n  --radio-border: var(--line);\n  --radio-border-selected: var(--accent);\n  --radio-dot: var(--accent-solid);\n\n  /* Slider */\n  --slider-track: var(--inset);\n  --slider-fill: var(--accent-solid);\n  --slider-thumb: var(--accent-bright);\n  --slider-thumb-ring: var(--accent-line);\n  --slider-thumb-border: var(--bg);\n\n  /* Stepper / number */\n  --stepper-surface: var(--card);\n  --stepper-border: var(--line);\n  --stepper-button-text: var(--fg-muted);\n  --stepper-button-surface-hover: var(--card-2);\n  --stepper-input-surface: var(--inset);\n\n  /* Combobox */\n  --combobox-surface: var(--card);\n  --combobox-border: var(--line);\n  --combobox-list-surface: var(--surface);\n  --combobox-list-border: var(--line);\n  --combobox-option-surface-hover: var(--card);\n  --combobox-option-selected-mark: var(--accent-text);\n\n  /* Tag input */\n  --tag-surface: var(--accent-dim);\n  --tag-border: var(--accent-line);\n  --tag-text: var(--accent-on-tint);\n\n  /* File upload */\n  --file-dropzone-surface: var(--inset);\n  --file-dropzone-border: var(--line);\n  --file-dropzone-border-active: var(--accent-line);\n  --file-progress: var(--accent);\n  --file-item-surface: var(--card);\n\n  /* Date field */\n  --date-surface: var(--inset);\n  --date-border: var(--line);\n  --date-segment-surface-active: var(--accent-dim);\n  --date-segment-text-active: var(--accent-text);\n\n  /* Breadcrumb / pagination / context menu / steps */\n  --breadcrumb-text: var(--fg-muted);\n  --breadcrumb-text-current: var(--fg);\n  --breadcrumb-surface-hover: var(--card-2);\n  --pagination-text: var(--fg-muted);\n  --pagination-surface-hover: var(--card-2);\n  --pagination-surface-current: var(--accent-dim);\n  --pagination-text-current: var(--accent-on-tint);\n  --pagination-border-current: var(--accent-line);\n  --tab-underline-indicator: var(--accent-text);\n  --context-item-text: var(--fg-muted);\n  --context-item-surface-hover: var(--card);\n  --context-item-text-danger: var(--danger);\n  --step-dot-surface: var(--card);\n  --step-dot-border: var(--line);\n  --step-dot-surface-done: var(--accent-solid);\n  --step-dot-text-done: var(--accent-solid-ink);\n  --step-dot-border-active: var(--accent);\n  --step-line: var(--line);\n  --step-line-done: var(--accent);\n\n  /* Data-viz structure */\n  --viz-gridline: var(--line-soft);\n  --viz-axis-text: var(--fg-faint);\n  --viz-tooltip-surface: var(--card-2);\n  --viz-tooltip-value: var(--fg);\n}\n\n/* ───────────── density · compact ───────────── */\n[data-density=\"compact\"] {\n  --control-height: 30px;\n  --control-height-sm: 24px;\n  --control-height-lg: 34px;\n  --control-pad-x: 11px;\n  --row-pad-y: 6px;\n  --row-pad-x: 10px;\n}\n\n/* ============================================================\n   editor.css — Keiko Editor theme tokens (--ed-*).\n   EXTENDS the base palette — it does not fork it. Editor chrome reuses\n   --bg / --fg / --danger / --warn / --info; only the syntax palette and\n   editor-specific chrome / diff / ghost-text are net-new.\n   Variants: dark (:root) · light · high-contrast (media + [data-hc]).\n   ============================================================ */\n:root {\n  --ed-bg: oklch(0.16 0.004 160);\n  --ed-bg-gutter: oklch(0.16 0.004 160);\n  --ed-fg: #c5cdd9;\n\n  --ed-syn-comment:  #7d8ba5;\n  --ed-syn-string:   #c3e88d;\n  --ed-syn-number:   #f78c6c;\n  --ed-syn-constant: #f78c6c;\n  --ed-syn-keyword:  #c792ea;\n  --ed-syn-type:     #ffcb6b;\n  --ed-syn-function: #82aaff;\n  --ed-syn-property: #80cbc4;\n  --ed-syn-variable: #c5cdd9;\n  --ed-syn-operator: #89ddff;\n  --ed-syn-punct:    #89ddff;\n  --ed-syn-regexp:   #e9a3a3;\n\n  --ed-gutter-fg:        color-mix(in oklch, var(--fg) 38%, transparent);\n  --ed-gutter-fg-active: var(--fg-muted);\n  --ed-line-active:      color-mix(in oklch, var(--fg) 5%, transparent);\n  --ed-cursor:           var(--fg);\n  --ed-selection:        color-mix(in oklch, var(--accent) 26%, transparent);\n  --ed-bracket-match:    var(--accent-line);\n  --ed-indent-guide:     var(--line-soft);\n\n  --ed-diff-ins-line: color-mix(in oklch, oklch(0.72 0.16 150) 15%, transparent);\n  --ed-diff-ins-gutter: oklch(0.72 0.13 150);\n  --ed-diff-rem-line: color-mix(in oklch, var(--danger) 15%, transparent);\n  --ed-diff-rem-gutter: var(--danger);\n\n  --ed-error: var(--danger);\n  --ed-warn:  var(--warn);\n  --ed-info:  var(--info);\n  --ed-ghost: var(--fg-dim);\n\n  --ed-tab-bg:          var(--surface);\n  --ed-tab-active-bg:   var(--ed-bg);\n  --ed-tab-active-fg:   var(--fg);\n  --ed-tab-inactive-fg: var(--fg-faint);\n  --ed-tab-accent:      var(--accent);\n  --ed-statusbar-bg:    var(--surface);\n  --ed-statusbar-fg:    var(--fg-muted);\n  --ed-statusbar-accent:var(--accent-text);\n  --ed-minimap-slider:  color-mix(in oklch, var(--fg) 10%, transparent);\n\n  --ed-run-glyph:    var(--accent-text);\n  --ed-breakpoint:   var(--danger);\n  --ed-vcs-added:    var(--ed-diff-ins-gutter);\n  --ed-vcs-modified: var(--info);\n\n  /* agent-in-editor */\n  --ed-agent-line:   color-mix(in oklch, var(--accent) 12%, transparent);\n  --ed-agent-gutter: var(--accent-text);\n  --ed-agent-chip-bg:   var(--accent-dim);\n  --ed-agent-chip-line: var(--accent-line);\n}\n\n[data-theme=\"light\"] {\n  --ed-bg: oklch(0.985 0.003 160);\n  --ed-bg-gutter: oklch(0.985 0.003 160);\n  --ed-fg: #2b3440;\n  --ed-syn-comment:  #5a6675;\n  --ed-syn-string:   #2c7430;\n  --ed-syn-number:   #a8480a;\n  --ed-syn-constant: #a8480a;\n  --ed-syn-keyword:  #8b2bb8;\n  --ed-syn-type:     #856000;\n  --ed-syn-function: #235fc0;\n  --ed-syn-property: #0e6b66;\n  --ed-syn-variable: #2b3440;\n  --ed-syn-operator: #0f7491;\n  --ed-syn-punct:    #0f7491;\n  --ed-syn-regexp:   #a33b3b;\n  --ed-ghost: oklch(0.55 0.02 160);\n}\n\n@media (prefers-contrast: more) {\n  :root { --ed-bg: oklch(0.07 0.004 160); --ed-bg-gutter: oklch(0.07 0.004 160); --ed-fg: #ffffff;\n    --ed-syn-comment:#9bb0c9; --ed-syn-string:#b6f08a; --ed-syn-number:#ffb38a; --ed-syn-constant:#ffb38a;\n    --ed-syn-keyword:#d8b6ff; --ed-syn-type:#ffd479; --ed-syn-function:#9fc1ff; --ed-syn-property:#8fe0d8;\n    --ed-syn-variable:#e8edf3; --ed-syn-operator:#a6e9ff; --ed-syn-punct:#a6e9ff; --ed-syn-regexp:#f3b0b0; --ed-ghost: oklch(0.74 0.004 160); }\n  [data-theme=\"light\"] { --ed-bg: oklch(1 0 0); --ed-bg-gutter: oklch(1 0 0); --ed-fg: #000000;\n    --ed-syn-comment:#46525f; --ed-syn-string:#1a5d1d; --ed-syn-number:#8a3600; --ed-syn-constant:#8a3600;\n    --ed-syn-keyword:#6f1b96; --ed-syn-type:#5f4200; --ed-syn-function:#143f8f; --ed-syn-property:#0a5c57;\n    --ed-syn-variable:#000000; --ed-syn-operator:#0a5e75; --ed-syn-punct:#0a5e75; --ed-syn-regexp:#8a2020; --ed-ghost: oklch(0.42 0.01 160); }\n}\n[data-hc=\"more\"] { --ed-bg: oklch(0.07 0.004 160); --ed-bg-gutter: oklch(0.07 0.004 160); --ed-fg: #ffffff;\n  --ed-syn-comment:#9bb0c9; --ed-syn-string:#b6f08a; --ed-syn-number:#ffb38a; --ed-syn-constant:#ffb38a;\n  --ed-syn-keyword:#d8b6ff; --ed-syn-type:#ffd479; --ed-syn-function:#9fc1ff; --ed-syn-property:#8fe0d8;\n  --ed-syn-variable:#e8edf3; --ed-syn-operator:#a6e9ff; --ed-syn-punct:#a6e9ff; --ed-syn-regexp:#f3b0b0; --ed-ghost: oklch(0.74 0.004 160); }\n[data-hc=\"more\"][data-theme=\"light\"] { --ed-bg: oklch(1 0 0); --ed-bg-gutter: oklch(1 0 0); --ed-fg: #000000;\n  --ed-syn-comment:#46525f; --ed-syn-string:#1a5d1d; --ed-syn-number:#8a3600; --ed-syn-constant:#8a3600;\n  --ed-syn-keyword:#6f1b96; --ed-syn-type:#5f4200; --ed-syn-function:#143f8f; --ed-syn-property:#0a5c57;\n  --ed-syn-variable:#000000; --ed-syn-operator:#0a5e75; --ed-syn-punct:#0a5e75; --ed-syn-regexp:#8a2020; --ed-ghost: oklch(0.42 0.01 160); }\n\n/* ============================================================\n   surfaces.css — Keiko board + window shells and the signature\n   window controls (Kerf · Ductus · Lift). Lifted from the\n   primitive layer; consumed by the Window/Card component and the\n   workspace UI kit.\n   ============================================================ */\n\n/* ===== board shells ===================================================== */\n.kx {\n  height: 100%;\n  font-family: var(--font-ui);\n  color: var(--fg);\n  box-sizing: border-box;\n}\n.kx *, .kx *::before, .kx *::after { box-sizing: border-box; }\n\n.kx-bg      { background: var(--bg); }\n.kx-surface { background: var(--surface); }\n.kx-card    { background: var(--card); }\n\n/* the dot-grid surface — the canvas the workspace sits on */\n.kx-grid-surface {\n  background-color: var(--bg);\n  background-image: radial-gradient(circle at 1px 1px, var(--grid-dot) 1px, transparent 0);\n  background-size: 24px 24px;\n}\n\n/* card / panel */\n.card {\n  background: var(--card);\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  box-shadow: 0 1px 0 0 oklch(1 0 0 / 0.03) inset, 0 8px 24px -14px rgba(0, 0, 0, 0.6);\n}\n\n/* ===== window mock ====================================================== */\n.kx-win {\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  background: var(--card);\n  box-shadow: 0 1px 0 0 oklch(1 0 0 / 0.03) inset, 0 8px 24px -12px rgba(0, 0, 0, 0.6);\n  overflow: hidden;\n}\n.kx-win.active { box-shadow: var(--shadow-pop); border-color: var(--accent-line); }\n.kx-winhead {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  height: 38px;\n  padding: 0 6px 0 12px;\n  border-bottom: 1px solid var(--line-soft);\n}\n.kx-winhead .kx-ico { display: grid; place-items: center; color: var(--fg-dim); }\n.kx-wintitle { font-size: 13.5px; font-weight: 650; color: var(--fg); }\n.kx-winsub {\n  font-size: 11px;\n  font-weight: 500;\n  color: var(--fg-muted);\n  background: var(--inset);\n  padding: 2px 7px;\n  border-radius: 6px;\n}\n.kx-grow { flex: 1; }\n.kx-winbody { padding: 15px; display: flex; flex-direction: column; gap: 9px; }\n.kx-skel { height: 8px; border-radius: 5px; background: var(--inset); }\n.kx-skel.s1 { width: 64%; }\n.kx-skel.s2 { width: 86%; }\n.kx-skel.s3 { width: 40%; }\n\n/* ===== window controls (Lift signature) ================================= */\n.kx-controls { display: flex; align-items: center; gap: 3px; }\n.kx-ctl {\n  position: relative;\n  display: grid;\n  place-items: center;\n  border: 0;\n  background: transparent;\n  cursor: pointer;\n  color: var(--fg-faint);\n  transition: color 0.12s;\n}\n.kx-ctl svg { position: relative; z-index: 1; overflow: visible; }\n.kx-chip {\n  position: absolute;\n  inset: 3px;\n  border-radius: 7px;\n  opacity: 0;\n  transition: opacity 0.12s, transform 0.12s;\n}\n.kx-ctl:hover, .kx-ctl[data-force=\"hover\"] { color: var(--fg); }\n.kx-ctl:hover .kx-chip, .kx-ctl[data-force=\"hover\"] .kx-chip { opacity: 1; }\n.kx-ctl[data-act=\"max\"]:hover, .kx-ctl[data-act=\"max\"][data-force=\"hover\"]   { color: var(--accent-text); }\n.kx-ctl[data-act=\"close\"]:hover, .kx-ctl[data-act=\"close\"][data-force=\"hover\"] { color: var(--danger); }\n\n/* — Kerf: chamfered chip, the cut-corner signature — */\n.kx-ctl[data-dir=\"kerf\"] .kx-chip {\n  background: var(--card-2);\n  clip-path: polygon(0 0, 70% 0, 100% 32%, 100% 100%, 0 100%);\n  box-shadow: inset 0 0 0 1px var(--line);\n}\n.kx-ctl[data-dir=\"kerf\"][data-act=\"max\"] .kx-chip   { box-shadow: inset 0 0 0 1px var(--accent-line); }\n.kx-ctl[data-dir=\"kerf\"][data-act=\"close\"] .kx-chip { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--danger) 55%, transparent); }\n\n/* — Ductus: soft round chip — */\n.kx-ctl[data-dir=\"ductus\"] .kx-chip { background: var(--card-2); border-radius: 50%; }\n.kx-ctl[data-dir=\"ductus\"][data-act=\"max\"] .kx-chip   { background: color-mix(in oklch, var(--accent) 14%, var(--card-2)); }\n.kx-ctl[data-dir=\"ductus\"][data-act=\"close\"] .kx-chip { background: color-mix(in oklch, var(--danger) 14%, var(--card-2)); }\n\n/* — Lift: ring halo (the chosen signature) — */\n.kx-ctl[data-dir=\"lift\"] .kx-chip {\n  background: transparent;\n  border-radius: 50%;\n  box-shadow: 0 0 0 1px var(--line-soft) inset;\n}\n.kx-ctl[data-dir=\"lift\"]:hover .kx-chip,\n.kx-ctl[data-dir=\"lift\"][data-force=\"hover\"] .kx-chip {\n  box-shadow: 0 0 0 1px var(--line) inset, 0 0 0 4px var(--accent-glow);\n}\n.kx-ctl[data-dir=\"lift\"][data-act=\"close\"]:hover .kx-chip,\n.kx-ctl[data-dir=\"lift\"][data-act=\"close\"][data-force=\"hover\"] .kx-chip {\n  box-shadow: 0 0 0 1px var(--line) inset, 0 0 0 4px color-mix(in oklch, var(--danger) 26%, transparent);\n}\n.kx-ctl[data-act=\"min\"]:active .kx-chip,\n.kx-ctl[data-act=\"max\"]:active .kx-chip,\n.kx-ctl[data-act=\"close\"]:active .kx-chip { transform: scale(0.92); }\n\n/* ============================================================\n   components.css — Keiko component library (class layer).\n   Every declaration resolves to the tier-2/3 token layer\n   (semantic.css). React components emit these class names.\n   ============================================================ */\n.ico { display: inline-grid; place-items: center; }\n\n/* demo scaffolding */\n.demo-card { padding: 26px 28px; }\n.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }\n.demo-stack { display: flex; flex-direction: column; gap: 12px; }\n.demo-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 14px; }\n.cls { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-accent); }\n.muted-cap { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }\n\n/* ── buttons ─────────────────────────────────────────────── */\n.c-btn {\n  display: inline-flex; align-items: center; gap: 7px;\n  height: var(--control-height); padding: 0 var(--control-pad-x);\n  border-radius: var(--radius-control);\n  border: 1px solid var(--button-secondary-border);\n  background: var(--button-secondary-surface);\n  color: var(--button-secondary-text);\n  font: var(--weight-medium) 13px var(--font-ui);\n  cursor: pointer;\n  transition: border-color 0.13s, background 0.13s, transform 0.06s;\n}\n.c-btn:hover { border-color: var(--border-strong); }\n.c-btn:active { transform: translateY(0.5px); }\n.c-btn:disabled { opacity: var(--opacity-disabled); cursor: not-allowed; }\n.c-btn--primary { background: var(--button-primary-surface); border-color: transparent; color: var(--button-primary-text); font-weight: var(--weight-semibold); }\n.c-btn--primary:hover { background: var(--button-primary-surface-hover); border-color: transparent; }\n.c-btn--accent { background: var(--surface-accent-subtle); border-color: var(--border-accent); color: var(--accent-on-tint); }\n.c-btn--accent:hover { background: var(--surface-accent-glow); border-color: var(--action-primary); }\n.c-btn--ghost { background: transparent; border-color: transparent; color: var(--action-tertiary-text); }\n.c-btn--ghost:hover { background: var(--surface-secondary); color: var(--text-primary); border-color: transparent; }\n.c-btn--danger { background: transparent; border-color: color-mix(in oklch, var(--feedback-danger) 45%, transparent); color: var(--feedback-danger); }\n.c-btn--danger:hover { background: color-mix(in oklch, var(--feedback-danger) 14%, transparent); }\n.c-btn--danger-solid { background: var(--feedback-danger); border-color: transparent; color: var(--ink-inverse); font-weight: var(--weight-semibold); }\n.c-btn--sm { height: var(--control-height-sm); padding: 0 10px; font-size: 12px; }\n.c-btn--lg { height: var(--control-height-lg); padding: 0 18px; font-size: 14px; }\n.c-iconbtn {\n  width: 32px; height: 32px; display: grid; place-items: center;\n  border-radius: var(--radius-control); border: 1px solid transparent;\n  background: transparent; color: var(--text-secondary); cursor: pointer; transition: background 0.13s, color 0.13s;\n}\n.c-iconbtn:hover { background: var(--surface-secondary); color: var(--text-primary); }\n.c-iconbtn--sm { width: 28px; height: 28px; }\n\n/* ── form controls ───────────────────────────────────────── */\n.c-field {\n  width: 100%;\n  padding: 9px 12px;\n  border-radius: var(--radius-control);\n  border: 1px solid var(--border-subtle);\n  background: var(--input-surface);\n  color: var(--input-text);\n  font: 13px var(--font-ui);\n  outline: none;\n  transition: border-color 0.13s, box-shadow 0.13s;\n}\n.c-field::placeholder { color: var(--input-placeholder); }\n.c-field:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--input-ring-focus); }\n.c-field--area { resize: vertical; min-height: 88px; line-height: 1.5; }\n.c-search { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: var(--radius-control); background: var(--input-surface); border: 1px solid var(--border-subtle); color: var(--text-faint); }\n.c-search:focus-within { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--input-ring-focus); }\n.c-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--input-text); font: 13px var(--font-ui); }\n.c-select { position: relative; display: inline-flex; align-items: center; }\n.c-select select {\n  appearance: none; -webkit-appearance: none;\n  padding: 9px 36px 9px 12px;\n  border-radius: var(--radius-control); border: 1px solid var(--input-border); background: var(--surface-primary); color: var(--text-primary);\n  font: 13px var(--font-ui); cursor: pointer; outline: none;\n}\n.c-select select:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--input-ring-focus); }\n.c-select .chev { position: absolute; right: 11px; pointer-events: none; color: var(--text-faint); }\n.c-label { display: block; font-size: 11px; font-weight: var(--weight-semibold); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px; }\n\n/* ── toggle ──────────────────────────────────────────────── */\n.c-toggle { width: 42px; height: 24px; border-radius: var(--radius-pill); background: var(--surface-inset); border: 1px solid var(--border-default); position: relative; cursor: pointer; padding: 0; flex: none; transition: background 0.15s, border-color 0.15s; }\n.c-toggle span { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--text-primary); transition: left 0.16s, background 0.15s; }\n.c-toggle[aria-checked=\"true\"] { background: var(--surface-accent-subtle); border-color: var(--border-accent); }\n.c-toggle[aria-checked=\"true\"] span { left: 20px; background: var(--accent-bright); }\n.c-switchrow { display: flex; align-items: center; gap: 12px; }\n.c-switchrow .t { font-size: 13px; color: var(--text-primary); }\n\n/* ── tabs (segmented) ────────────────────────────────────── */\n.c-tabs { display: inline-flex; align-items: center; gap: 4px; }\n.c-tab { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: var(--radius-control); font: 13px var(--font-ui); color: var(--nav-item-text); border: 1px solid transparent; background: transparent; cursor: pointer; }\n.c-tab:hover { color: var(--nav-item-text-active); }\n.c-tab[aria-selected=\"true\"] { background: var(--nav-item-surface-active); color: var(--nav-item-text-active); border-color: var(--border-subtle); }\n.c-seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-inset); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }\n.c-seg button { padding: 5px 12px; border: 0; background: transparent; color: var(--text-secondary); border-radius: 6px; font: 12.5px var(--font-ui); cursor: pointer; }\n.c-seg button[aria-selected=\"true\"] { background: var(--surface-secondary); color: var(--text-primary); }\n\n/* ── underline tabs ──────────────────────── ter; font: var(--weight-semibold) 10.5px var(--font-mono); color: var(--accent-on-tint); background: var(--ai-source-surface); border: 1px solid var(--ai-source-border); }\n.ai-source .tl { font-size: var(--text-body-sm); color: var(--text-primary); }\n.ai-source .ur { font-size: var(--text-caption); color: var(--text-faint); font-family: var(--font-mono); margin-left: auto; }\n\n/* ── confidence ──────────────────────────────────────────────── */\n.ai-conf { display: inline-flex; align-items: center; gap: 9px; }\n.ai-conf .track { display: inline-flex; gap: 3px; }\n.ai-conf .track i { width: 16px; height: 5px; border-radius: 999px; background: var(--surface-inset); }\n.ai-conf .lbl { font: var(--weight-semibold) 11px var(--font-mono); letter-spacing: 0.03em; text-transform: uppercase; }\n.ai-conf[data-level=\"high\"] .track i:nth-child(-n+3) { background: var(--ai-confidence-high); }\n.ai-conf[data-level=\"high\"] .lbl { color: var(--ai-confidence-high); }\n.ai-conf[data-level=\"medium\"] .track i:nth-child(-n+2) { background: var(--ai-confidence-medium); }\n.ai-conf[data-level=\"medium\"] .lbl { color: var(--ai-confidence-medium); }\n.ai-conf[data-level=\"low\"] .track i:nth-child(-n+1) { background: var(--ai-confidence-low); }\n.ai-conf[data-level=\"low\"] .lbl { color: var(--ai-confidence-low); }\n\n/* ── stop / regenerate controls ──────────────────────────────── */\n.ai-controls { display: inline-flex; align-items: center; gap: 8px; }\n.ai-stop { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: var(--radius-control); border: 1px solid color-mix(in oklch, var(--feedback-danger) 42%, transparent); background: transparent; color: var(--feedback-danger); font: var(--weight-medium) 12.5px var(--font-ui); cursor: pointer; }\n.ai-stop:hover { background: color-mix(in oklch, var(--feedback-danger) 12%, transparent); }\n.ai-stop .sq { width: 9px; height: 9px; border-radius: 2px; background: currentColor; }\n\n/* ── permission request ──────────────────────────────────────── */\n.ai-permit { border: 1px solid var(--ai-permission-border); background: var(--ai-permission-surface); border-radius: var(--radius-surface); padding: 15px 16px; max-width: 560px; }\n.ai-permit-h { display: flex; align-items: center; gap: 10px; }\n.ai-permit-h .ic { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; background: color-mix(in oklch, var(--feedback-warning) 16%, transparent); color: var(--feedback-warning); }\n.ai-permit-h .tt { font-size: var(--text-body); font-weight: var(--weight-semibold); color: var(--text-primary); }\n.ai-permit-h .ts { font-size: var(--text-label); color: var(--text-secondary); margin-top: 1px; }\n.ai-permit-scope { margin: 13px 0; padding: 11px 13px; border-radius: var(--radius-control); background: var(--surface-primary); border: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 6px; }\n.ai-permit-scope .row { display: flex; align-items: center; gap: 9px; }\n.ai-permit-scope .row .gr { color: var(--feedback-success); }\n.ai-permit-act { display: flex; gap: 9px; }\n\n/* ── sensitive-action confirm ────────────────────────────────── */\n.ai-danger { border: 1px solid color-mix(in oklch, var(--feedback-danger) 45%, transparent); background: color-mix(in oklch, var(--feedback-danger) 7%, var(--surface-primary)); border-radius: var(--radius-surface); padding: 15px 16px; max-width: 560px; }\n.ai-danger-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }\n.ai-danger-h .ic { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; background: color-mix(in oklch, var(--feedback-danger) 15%, transparent); color: var(--feedback-danger); }\n.ai-danger-h .tt { font-size: var(--text-body); font-weight: var(--weight-semibold); color: var(--text-primary); }\n.ai-danger p { font-size: var(--text-body-sm); line-height: 1.55; color: var(--text-secondary); margin: 0 0 13px; }\n.ai-danger p code { font-family: var(--font-mono); font-size: 12px; color: var(--feedback-danger); }\n.ai-danger-act { display: flex; gap: 9px; }\n\n<\u002Fstyle>\n  <script src=\"00dad947-8fd1-43c2-8a9e-c9a7cb0eca4d\"><\u002Fscript>\n  <script src=\"4c092d73-1d4d-49c7-8053-75320bf0c36a\"><\u002Fscript>\n  <script src=\"e24cb0c0-e39f-42bf-90a1-11498ebf8c44\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); }\n    a { color: var(--accent-text); text-decoration: none; }\n    a:hover { color: var(--accent-bright); }\n    ::selection { background: var(--selection-surface); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--bg)\">\n\n<nav data-screen-label=\"Nav\" style=\"position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:24px;padding:12px 32px;background:color-mix(in oklch, var(--bg) 88%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)\">\n  <div style=\"display:flex;align-items:center;gap:10px\">\n    <div style=\"width:26px;height:26px;border-radius:7px;background:#4EBA87;position:relative;overflow:hidden\">\n      <img src=\"e651ecb6-1bb2-4abc-9e49-870bd36c7320\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;box-sizing:border-box\">\n    <\u002Fdiv>\n    <div style=\"font-size:13px;font-weight:650;letter-spacing:-0.01em\">Keiko <span style=\"color:var(--fg-muted)\">for Quality<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1\"><\u002Fdiv>\n  <div style=\"display:flex;gap:18px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em\">\n    <a href=\"#identity\" style=\"color:var(--fg-muted)\" style-hover=\"color:var(--fg)\">Identity<\u002Fa>\n    <a href=\"#foundations\" style=\"color:var(--fg-muted)\" style-hover=\"color:var(--fg)\">Foundations<\u002Fa>\n    <a href=\"#icons\" style=\"color:var(--fg-muted)\" style-hover=\"color:var(--fg)\">Icons<\u002Fa>\n    <a href=\"#voice\" style=\"color:var(--fg-muted)\" style-hover=\"color:var(--fg)\">Voice<\u002Fa>\n    <a href=\"#github\" style=\"color:var(--fg-muted)\" style-hover=\"color:var(--fg)\">GitHub<\u002Fa>\n    <a href=\"#email\" style=\"color:var(--fg-muted)\" style-hover=\"color:var(--fg)\">Email<\u002Fa>\n    <a href=\"#cli\" style=\"color:var(--fg-muted)\" style-hover=\"color:var(--fg)\">CLI<\u002Fa>\n    <a href=\"#ide\" style=\"color:var(--fg-muted)\" style-hover=\"color:var(--fg)\">IDE<\u002Fa>\n    <a href=\"#badges\" style=\"color:var(--fg-muted)\" style-hover=\"color:var(--fg)\">Badges<\u002Fa>\n    <a href=\"#ship\" style=\"color:var(--fg-muted)\" style-hover=\"color:var(--fg)\">Ship<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<header data-screen-label=\"Hero\" class=\"kx-grid-surface\" style=\"border-bottom:1px solid var(--line-soft)\">\n  <div style=\"max-width:1080px;margin:0 auto;padding:88px 32px 72px\">\n    <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:28px\">\n      <div style=\"width:72px;height:72px;border-radius:18px;background:#4EBA87;position:relative;box-shadow:var(--shadow-card)\">\n        <img src=\"e651ecb6-1bb2-4abc-9e49-870bd36c7320\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px;box-sizing:border-box\">\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:var(--text-display-sm);font-weight:650;letter-spacing:-0.015em;line-height:1.1\">Keiko <span style=\"color:var(--fg-muted)\">for Quality<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg-dim);margin-top:8px;letter-spacing:0.04em\">design system · extends Keiko · v1.0<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"max-width:620px;font-size:var(--text-body-lg);line-height:1.65;color:var(--fg-muted);margin:0 0 28px\">\n      The visual and verbal language of Keiko's review bot — the product that publishes model-backed code\n      review findings as native pull-request conversations. It reads content, writes review comments, and\n      nothing else. This system covers every surface the bot touches: GitHub comments, email, CLI, checks\n      and badges. Tokens, type and the Lift icon grammar are inherited from the Keiko Design System;\n      nothing is redefined.\n    <\u002Fp>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em\">\n      <span style=\"padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--fg-muted)\">monochrome + orca green<\u002Fspan>\n      <span style=\"padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--fg-muted)\">no emoji — Lift icons<\u002Fspan>\n      <span style=\"padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--fg-muted)\">JetBrains Mono labels<\u002Fspan>\n      <span style=\"padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--fg-muted)\">calm, governed copy<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"identity\" data-screen-label=\"Identity\" style=\"border-bottom:1px solid var(--line-soft)\">\n  <div style=\"max-width:1080px;margin:0 auto;padding:72px 32px\">\n    <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px\">01 · Identity<\u002Fdiv>\n    <h2 style=\"font-size:var(--text-title-lg);font-weight:650;letter-spacing:-0.015em;margin:0 0 12px\">One orca, one added word<\u002Fh2>\n    <p style=\"max-width:600px;color:var(--fg-muted);line-height:1.65;margin:0 0 40px\">\n      Keiko for Quality is Keiko doing one job well — not a sub-brand. It keeps the orca avatar and the\n      brand green unchanged; the wordmark adds <em style=\"font-style:normal;color:var(--fg)\">for Quality<\u002Fem> in the muted text tone. The bot never\n      gets its own colour, its own icon set, or its own tone of voice.\n    <\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-card)\">\n        <div style=\"display:flex;align-items:center;gap:14px;padding:28px 0;justify-content:center\">\n          <div style=\"width:52px;height:52px;border-radius:14px;background:#4EBA87;position:relative\">\n            <img src=\"e651ecb6-1bb2-4abc-9e49-870bd36c7320\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;box-sizing:border-box\">\n          <\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:650;letter-spacing:-0.015em\">Keiko <span style=\"color:var(--fg-muted)\">for Quality<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:6px\">Primary lockup<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--fg-muted);line-height:1.5\">Avatar tile + wordmark. \"Keiko\" carries weight 650; \"for Quality\" sits in <code style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg-dim)\">--fg-muted<\u002Fcode>, same size and weight. Clear space: half the tile on all sides.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-card)\">\n        <div style=\"display:flex;align-items:center;gap:18px;padding:28px 0;justify-content:center\">\n          <div style=\"text-align:center\">\n            <div style=\"width:40px;height:40px;border-radius:10px;background:#4EBA87;position:relative;margin:0 auto\">\n              <img src=\"e651ecb6-1bb2-4abc-9e49-870bd36c7320\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px;box-sizing:border-box\">\n            <\u002Fdiv>\n            <div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:8px\">40 px · GitHub<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center\">\n            <div style=\"width:26px;height:26px;border-radius:7px;background:#4EBA87;position:relative;margin:0 auto\">\n              <img src=\"e651ecb6-1bb2-4abc-9e49-870bd36c7320\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2.5px;box-sizing:border-box\">\n            <\u002Fdiv>\n            <div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:8px\">26 px · chrome<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center\">\n            <div style=\"width:20px;height:20px;border-radius:6px;background:#4EBA87;position:relative;margin:0 auto\">\n              <img src=\"e651ecb6-1bb2-4abc-9e49-870bd36c7320\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;box-sizing:border-box\">\n            <\u002Fdiv>\n            <div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:8px\">20 px · inline<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:6px\">Avatar<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--fg-muted);line-height:1.5\">Ink orca on an orca-green tile — identical to Keiko's GitHub identity. Ships as PNG at 512/128/40 px. Never outlined, never recoloured, never on a photo.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-card)\">\n        <div style=\"padding:28px 0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center\">\n          <div style=\"font-family:var(--font-mono);font-size:13px;color:var(--fg)\">keiko-for-quality<span style=\"color:var(--fg-dim)\">[bot]<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:var(--font-mono);font-size:13px;color:var(--fg)\">Keiko for Quality <span style=\"color:var(--fg-dim)\">— run summary<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:var(--font-mono);font-size:13px;color:var(--fg)\">keiko-quality <span style=\"color:var(--fg-dim)\">(CLI binary)<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:6px\">Naming<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--fg-muted);line-height:1.5\">Full name in prose and headings; <code style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg-dim)\">keiko-for-quality<\u002Fcode> as the handle. Never \"KfQ\", never \"Quality Bot\", never translated.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"foundations\" data-screen-label=\"Foundations\" style=\"border-bottom:1px solid var(--line-soft)\">\n  <div style=\"max-width:1080px;margin:0 auto;padding:72px 32px\">\n    <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px\">02 · Foundations<\u002Fdiv>\n    <h2 style=\"font-size:var(--text-title-lg);font-weight:650;letter-spacing:-0.015em;margin:0 0 12px\">Severity carries colour, category carries shape<\u002Fh2>\n    <p style=\"max-width:640px;color:var(--fg-muted);line-height:1.65;margin:0 0 40px\">\n      The review vocabulary maps onto Keiko's four status colours — no new hues. Severity is the only\n      dimension that speaks in colour; categories and outcomes stay monochrome and are told apart by their\n      glyph. Green remains reserved: <code style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg-dim)\">--ok<\u002Fcode> marks a complete run, orca green marks interaction only.\n    <\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px\">\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-card)\">\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:16px\">Severity scale<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;background:var(--inset)\">\n            <span data-qicon=\"sevCritical\" data-size=\"18\" style=\"color:var(--danger);display:inline-flex\"><\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;width:70px\">Critical<\u002Fspan>\n            <code style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);white-space:nowrap\">--sev-critical → --danger<\u002Fcode>\n            <span style=\"font-size:12px;color:var(--fg-muted);margin-left:auto;text-align:right\">exploitable, corrupting, blocking<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px\">\n            <span data-qicon=\"sevMajor\" data-size=\"18\" style=\"color:var(--warn);display:inline-flex\"><\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;width:70px\">Major<\u002Fspan>\n            <code style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);white-space:nowrap\">--sev-major → --warn<\u002Fcode>\n            <span style=\"font-size:12px;color:var(--fg-muted);margin-left:auto;text-align:right\">wrong behaviour, real cost<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;background:var(--inset)\">\n            <span data-qicon=\"sevMinor\" data-size=\"18\" style=\"color:var(--info);display:inline-flex\"><\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;width:70px\">Minor<\u002Fspan>\n            <code style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);white-space:nowrap\">--sev-minor → --info<\u002Fcode>\n            <span style=\"font-size:12px;color:var(--fg-muted);margin-left:auto;text-align:right\">worth fixing, not urgent<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px\">\n            <span data-qicon=\"sevNit\" data-size=\"18\" style=\"color:var(--fg-dim);display:inline-flex\"><\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;width:70px\">Nit<\u002Fspan>\n            <code style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);white-space:nowrap\">--sev-nit → --fg-dim<\u002Fcode>\n            <span style=\"font-size:12px;color:var(--fg-muted);margin-left:auto;text-align:right\">style, naming, taste<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--fg-dim);line-height:1.5;margin-top:14px\">Rank chevrons: three marks down to one, then the seamed dot. Weight is countable even in monochrome and at 14 px.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-card)\">\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:16px\">Run outcomes<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;background:var(--inset)\">\n            <span data-qicon=\"outComplete\" data-size=\"18\" style=\"color:var(--ok);display:inline-flex\"><\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;width:96px\">Complete<\u002Fspan>\n            <code style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);white-space:nowrap\">--ok<\u002Fcode>\n            <span style=\"font-size:12px;color:var(--fg-muted);margin-left:auto;text-align:right\">every reviewable path settled<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px\">\n            <span data-qicon=\"outIncomplete\" data-size=\"18\" style=\"color:var(--warn);display:inline-flex\"><\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;width:96px\">Incomplete<\u002Fspan>\n            <code style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);white-space:nowrap\">--warn<\u002Fcode>\n            <span style=\"font-size:12px;color:var(--fg-muted);margin-left:auto;text-align:right\">coverage owed, reason code named<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;background:var(--inset)\">\n            <span data-qicon=\"outAbandoned\" data-size=\"18\" style=\"color:var(--fg-muted);display:inline-flex\"><\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;width:96px\">Abandoned<\u002Fspan>\n            <code style=\"font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);white-space:nowrap\">--fg-muted<\u002Fcode>\n            <span style=\"font-size:12px;color:var(--fg-muted);margin-left:auto;text-align:right\">a newer head superseded the run<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--line-soft);margin-top:18px;padding-top:16px\">\n          <div style=\"font-size:13px;font-weight:600;margin-bottom:10px\">Type on bot surfaces<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--fg-muted);line-height:1.65\">\n            Classification labels, counts, SHAs, reason codes, budgets: <span style=\"font-family:var(--font-mono);color:var(--fg)\">JetBrains Mono<\u002Fspan>.\n            Prose: the host's own text face — GitHub's and the mail client's rendering is part of being a good citizen there.\n            Tracked ALL-CAPS only at 10–11 px mono. Floor stays 11 px; email floor 12 px.\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-card)\">\n      <div style=\"font-size:13px;font-weight:600;margin-bottom:4px\">Retiring the emoji vocabulary<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--fg-dim);margin-bottom:16px\">Every emoji the bot publishes today has a named successor. Nothing else changes in the comment structure.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--inset);border-radius:9px;font-size:12px\"><span>🔒 🐛 ⚡ 🧪<\u002Fspan><span style=\"color:var(--fg-faint)\">→<\u002Fspan><span style=\"display:inline-flex;gap:6px;color:var(--fg-muted)\"><span data-qicon=\"catSecurity\" data-size=\"15\" style=\"display:inline-flex\"><\u002Fspan><span data-qicon=\"catCorrectness\" data-size=\"15\" style=\"display:inline-flex\"><\u002Fspan><span data-qicon=\"catPerformance\" data-size=\"15\" style=\"display:inline-flex\"><\u002Fspan><span data-qicon=\"catTests\" data-size=\"15\" style=\"display:inline-flex\"><\u002Fspan><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim)\">category glyphs<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--inset);border-radius:9px;font-size:12px\"><span>🔴 🟠 🟡 🔵<\u002Fspan><span style=\"color:var(--fg-faint)\">→<\u002Fspan><span style=\"display:inline-flex;gap:6px\"><span data-qicon=\"sevCritical\" data-size=\"15\" style=\"color:var(--danger);display:inline-flex\"><\u002Fspan><span data-qicon=\"sevMajor\" data-size=\"15\" style=\"color:var(--warn);display:inline-flex\"><\u002Fspan><span data-qicon=\"sevMinor\" data-size=\"15\" style=\"color:var(--info);display:inline-flex\"><\u002Fspan><span data-qicon=\"sevNit\" data-size=\"15\" style=\"color:var(--fg-dim);display:inline-flex\"><\u002Fspan><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim)\">severity chevrons<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--inset);border-radius:9px;font-size:12px\"><span>✅ ⚠️ ⏳<\u002Fspan><span style=\"color:var(--fg-faint)\">→<\u002Fspan><span style=\"display:inline-flex;gap:6px\"><span data-qicon=\"outComplete\" data-size=\"15\" style=\"color:var(--ok);display:inline-flex\"><\u002Fspan><span data-qicon=\"outIncomplete\" data-size=\"15\" style=\"color:var(--warn);display:inline-flex\"><\u002Fspan><span data-qicon=\"outAbandoned\" data-size=\"15\" style=\"color:var(--fg-muted);display:inline-flex\"><\u002Fspan><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim)\">outcome glyphs<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--inset);border-radius:9px;font-size:12px\"><span>🤖<\u002Fspan><span style=\"color:var(--fg-faint)\">→<\u002Fspan><span data-licon=\"agent\" data-size=\"16\" style=\"color:var(--fg-muted);display:inline-flex\"><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim)\">agent · \"Prompt for AI agents\"<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"icons\" data-screen-label=\"Iconography\" style=\"border-bottom:1px solid var(--line-soft)\">\n  <div style=\"max-width:1080px;margin:0 auto;padding:72px 32px\">\n    <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px\">03 · Iconography<\u002Fdiv>\n    <h2 style=\"font-size:var(--text-title-lg);font-weight:650;letter-spacing:-0.015em;margin:0 0 12px\">Lift, extended for review<\u002Fh2>\n    <p style=\"max-width:640px;color:var(--fg-muted);line-height:1.65;margin:0 0 40px\">\n      Fourteen new glyphs in the Lift grammar: 24×24 grid, 20×20 live area, stroke 1.6, round caps and\n      joins, no fills, and one open seam on every closed contour. Where Keiko already has the right glyph\n      — shield, flask, bolt, clock — Quality reuses it verbatim rather than redrawing.\n    <\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-bottom:18px\">\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"sevCritical\" data-size=\"26\" style=\"color:var(--danger);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">sevCritical<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"sevMajor\" data-size=\"26\" style=\"color:var(--warn);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">sevMajor<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"sevMinor\" data-size=\"26\" style=\"color:var(--info);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">sevMinor<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"sevNit\" data-size=\"26\" style=\"color:var(--fg-dim);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">sevNit<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"outComplete\" data-size=\"26\" style=\"color:var(--ok);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">outComplete<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"outIncomplete\" data-size=\"26\" style=\"color:var(--warn);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">outIncomplete<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"outAbandoned\" data-size=\"26\" style=\"color:var(--fg-muted);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">outAbandoned<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"reviewBot\" data-size=\"26\" style=\"color:var(--fg);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">reviewBot<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"catSecurity\" data-size=\"26\" style=\"color:var(--fg);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">catSecurity<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"catCorrectness\" data-size=\"26\" style=\"color:var(--fg);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">catCorrectness<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"catPerformance\" data-size=\"26\" style=\"color:var(--fg);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">catPerformance<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"catMaintainability\" data-size=\"26\" style=\"color:var(--fg);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">catMaintainability<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"catTests\" data-size=\"26\" style=\"color:var(--fg);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">catTests<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"catDocs\" data-size=\"26\" style=\"color:var(--fg);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">catDocs<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center\"><span data-qicon=\"catReview\" data-size=\"26\" style=\"color:var(--fg);display:inline-flex\"><\u002Fspan><div style=\"font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-top:10px\">catReview<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-card)\">\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:14px\">Small-size proof — 14 px, GitHub line height<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px\">\n          <div style=\"display:flex;align-items:center;gap:8px\"><span data-qicon=\"catTests\" data-size=\"14\" style=\"color:var(--fg-muted);display:inline-flex\"><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--fg-muted)\">TESTS<\u002Fspan><span style=\"color:var(--fg-faint)\">·<\u002Fspan><span data-qicon=\"sevMajor\" data-size=\"14\" style=\"color:var(--warn);display:inline-flex\"><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--warn)\">MAJOR<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px\"><span data-qicon=\"catSecurity\" data-size=\"14\" style=\"color:var(--fg-muted);display:inline-flex\"><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--fg-muted)\">SECURITY<\u002Fspan><span style=\"color:var(--fg-faint)\">·<\u002Fspan><span data-qicon=\"sevCritical\" data-size=\"14\" style=\"color:var(--danger);display:inline-flex\"><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--danger)\">CRITICAL<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px\"><span data-qicon=\"catDocs\" data-size=\"14\" style=\"color:var(--fg-muted);display:inline-flex\"><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--fg-muted)\">DOCS<\u002Fspan><span style=\"color:var(--fg-faint)\">·<\u002Fspan><span data-qicon=\"sevNit\" data-size=\"14\" style=\"color:var(--fg-dim);display:inline-flex\"><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--fg-dim)\">NIT<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--fg-dim);line-height:1.5;margin-top:14px\">Glyphs must stay legible at 14 px — the size they render inside a comment's classification line.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-card)\">\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:14px\">Grammar rules<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13px;color:var(--fg-muted);line-height:1.8\">\n          <li>Stroke 1.6 at 24 px — never scaled thicker for emphasis<\u002Fli>\n          <li>One open seam per closed contour (the lifted pen); chevrons belong by stroke quality<\u002Fli>\n          <li><code style=\"font-family:var(--font-mono);font-size:11px\">currentColor<\u002Fcode> only — colour comes from the severity or outcome token, never from the glyph<\u002Fli>\n          <li>Reused Keiko glyphs stay byte-identical: <code style=\"font-family:var(--font-mono);font-size:11px\">shield · bug · bolt · eval · clock · agent · pullRequest<\u002Fcode><\u002Fli>\n          <li>No emoji, anywhere, ever — including commit statuses and email subjects<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"voice\" data-screen-label=\"Voice\" style=\"border-bottom:1px solid var(--line-soft)\">\n  <div style=\"max-width:1080px;margin:0 auto;padding:72px 32px\">\n    <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px\">04 · Voice<\u002Fdiv>\n    <h2 style=\"font-size:var(--text-title-lg);font-weight:650;letter-spacing:-0.015em;margin:0 0 12px\">A reviewer you can refute<\u002Fh2>\n    <p style=\"max-width:640px;color:var(--fg-muted);line-height:1.65;margin:0 0 40px\">\n      Keiko's voice — precise, calm, governed, plain — plus the duties of a reviewer. Every finding is a\n      claim someone may refute with a measurement, so it must be specific enough to be wrong.\n    <\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-card)\">\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:14px\">Finding rules<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13px;color:var(--fg-muted);line-height:1.8\">\n          <li><strong style=\"color:var(--fg);font-weight:600\">Imperative title, one line.<\u002Fstrong> \"Add the required option to the activation call.\" Never \"There seems to be…\"<\u002Fli>\n          <li><strong style=\"color:var(--fg);font-weight:600\">Name the consequence.<\u002Fstrong> Defect, then what it causes, in ≤ 2 sentences<\u002Fli>\n          <li><strong style=\"color:var(--fg);font-weight:600\">Cite what you read.<\u002Fstrong> File, line, symbol — claims a reader can check<\u002Fli>\n          <li><strong style=\"color:var(--fg);font-weight:600\">Offer the way out.<\u002Fstrong> Every repair prompt licenses declining: \"reply with a reason instead of changing anything\"<\u002Fli>\n          <li>No exclamation marks, no apologies, no \"just\", no hedging adverbs<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow-card)\">\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:14px\">Terminology — one word per concept<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px\">\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg)\">Finding<\u002Fspan><span style=\"color:var(--fg-muted)\">never issue, comment, problem<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg)\">Run<\u002Fspan><span style=\"color:var(--fg-muted)\">one review of one head — never scan, pass<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg)\">Suppressed<\u002Fspan><span style=\"color:var(--fg-muted)\">withheld as duplicate — never hidden<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg)\">Dispositioned<\u002Fspan><span style=\"color:var(--fg-muted)\">settled by a substantive reply<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg)\">Owed<\u002Fspan><span style=\"color:var(--fg-muted)\">unreviewed coverage carried to the next run<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg)\">Head<\u002Fspan><span style=\"color:var(--fg-muted)\">the exact commit reviewed, always short-SHA<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--line-soft);margin-top:16px;padding-top:14px;font-size:12px;color:var(--fg-dim);line-height:1.65\">\n          Honesty invariants: an incomplete run never reads as clean · absent numbers are omitted, never\n          rendered as zero · spend is rounded up, never down · the bot states what it could not do before\n          what it did.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"github\" data-screen-label=\"GitHub surfaces\" style=\"border-bottom:1px solid var(--line-soft)\">\n  <div style=\"max-width:1080px;margin:0 auto;padding:72px 32px\">\n    <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px\">05 · GitHub surfaces<\u002Fdiv>\n    <h2 style=\"font-size:var(--text-title-lg);font-weight:650;letter-spacing:-0.015em;margin:0 0 12px\">Findings as native conversations<\u002Fh2>\n    <p style=\"max-width:640px;color:var(--fg-muted);line-height:1.65;margin:0 0 24px\">\n      GitHub Markdown allows no CSS and no inline SVG, so brand marks ship as pinned SVG image assets;\n      a pure-text form is specified for contexts where images are unwanted. Structure stays exactly what\n      <code style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg-dim)\">presentation.ts<\u002Fcode> composes today — classification, claim, argument, machinery.\n    <\u002Fp>\n    <div style=\"display:flex;gap:8px;margin-bottom:28px;font-family:var(--font-mono);font-size:11px\">\n      <span style=\"padding:5px 10px;border-radius:999px;border:1px solid {{ svgChipBorder }};color:{{ svgChipColor }}\">standard · svg assets<\u002Fspan>\n      <span style=\"padding:5px 10px;border-radius:999px;border:1px solid {{ textChipBorder }};color:{{ textChipColor }}\">fallback · text labels<\u002Fspan>\n      <span style=\"padding:5px 10px;color:var(--fg-faint)\">switch via Tweaks<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:24px;align-items:start;margin-bottom:24px\">\n      <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:12px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #21262d\">\n          <div style=\"width:24px;height:24px;border-radius:6px;background:#4EBA87;position:relative;flex:none\">\n            <img src=\"e651ecb6-1bb2-4abc-9e49-870bd36c7320\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2.5px;box-sizing:border-box\">\n          <\u002Fdiv>\n          <span style=\"font-size:13px;font-weight:600;color:#e6edf2\">keiko-for-quality<\u002Fspan>\n
