name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The reviewer runs inside other people's CI with a model credential and comment-write access, so
# its own pipeline holds no more authority than reading its source.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # Consumers execute dist/index.js, not src/. This proves the committed artifact is the one
      # this source produces, so a pinned action SHA actually pins reviewed code.
      - name: Verify committed bundle is reproducible
        run: npm run check:bundle

  engine-pin:
    name: engine pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # Downloads the pinned engine and verifies its digest. This is the supply-chain claim the
      # product makes to every consumer, so it is proved on every change rather than assumed.
      - name: Verify pinned engine digest
        run: npm run check:engine-pin
